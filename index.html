.empty-state{background:var(--parchment);border:2px dashed var(--parchment-shadow);border-radius:4px;padding:3rem 2rem;text-align:center;color:var(--steel)}
.empty-state h3{font-family:'Cinzel',serif;margin-bottom:.5rem;color:var(--ink)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#1a1209}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
@media(max-width:768px){.app{grid-template-columns:minmax(0,1fr)!important;padding:0 .6rem 2rem}.sidebar{position:static}.card-body{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}

/* ── ESTATES · bookkeeping ── */
.bk{padding:1.3rem 1.4rem 1.6rem;display:flex;flex-direction:column;gap:1.2rem}
.bk .pos{color:#2f6b38}.bk .neg{color:#9a2a1a}
.bk-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}
.bk-tile{background:var(--parchment-dark);border:1px solid var(--parchment-shadow);border-top:3px solid var(--gold);border-radius:3px;padding:.75rem .95rem}
.bk-tile .k{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--steel)}
.bk-tile .v{font-family:'Cinzel',serif;font-size:1.55rem;line-height:1.2;margin-top:.2rem;color:var(--ink)}
.bk-tile .v.sm{font-size:.95rem;margin-top:.45rem}
.bk-tile .v small{font-size:.8rem;color:var(--steel)}
.bk-tile .s{font-size:.82rem;color:var(--steel);font-style:italic;margin-top:.1rem}
.bk-top{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:1.2rem;align-items:start}
.bk-card{background:var(--parchment);border:1px solid var(--parchment-shadow);border-radius:3px;padding:1rem 1.1rem;box-shadow:2px 2px 0 rgba(0,0,0,.12)}
.bk-card h3{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#3a2008;font-weight:600;padding-bottom:.5rem;margin-bottom:.7rem;border-bottom:1px solid var(--parchment-shadow)}
.bk-card h3 .h3s{font-weight:400;color:var(--steel);letter-spacing:.08em;margin-left:.4rem;font-size:.6rem}
.bk-card h4{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);font-weight:600;margin:1.1rem 0 .55rem}
.bk-chart{position:relative}
.bk-chart svg{display:block;width:100%;height:auto;overflow:visible}
.bk-chart .g{stroke:var(--parchment-shadow);stroke-width:.6;opacity:.55}
.bk-chart .z{stroke:#5a4020;stroke-width:1.1}
.bk-chart .ax{font:11px 'Crimson Pro',Georgia,serif;fill:#6a5535}
.bk-chart .yr{font:600 11.5px 'Cinzel',Georgia,serif;fill:#3a2008}
.bk-chart .bl{font:600 11px 'Crimson Pro',Georgia,serif;fill:#2a1c08}
.bk-chart .dl{font:italic 12px 'Crimson Pro',Georgia,serif}
.bk-chart .pt{font:600 10px 'Cinzel',Georgia,serif;letter-spacing:.12em;fill:var(--steel);text-transform:uppercase}
.bk-chart .hit{fill:transparent;cursor:crosshair}
.bk-chart .cross{stroke:#5a4020;stroke-width:1;stroke-dasharray:2 3;opacity:.6;pointer-events:none}
.bk-legend{display:flex;gap:1.1rem;flex-wrap:wrap;font-size:.84rem;color:#3a2008;margin:-.1rem 0 .4rem}
.bk-legend span{display:inline-flex;align-items:center;gap:.4rem}
.bk-legend i{display:inline-block;width:18px;height:2px;border-radius:1px}
.bk-legend i.sq{width:11px;height:11px;border-radius:2px}
.bk-tip{position:absolute;display:none;pointer-events:none;z-index:5;min-width:150px;background:#1a1209;color:#f0e2c4;border:1px solid var(--gold);border-radius:3px;padding:.5rem .65rem;font-size:.86rem;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.bk-tip b{font-family:'Cinzel',serif;color:var(--gold-light)}
.bk-tip .h{color:#c9a86a;font-style:italic}
.bk-tip .r{display:flex;justify-content:space-between;gap:1rem;margin-top:.15rem}
.bk-tip .r.t{border-top:1px solid rgba(184,144,42,.4);margin-top:.3rem;padding-top:.25rem;font-weight:600}
.bk-tip .pos{color:#9fd08a}.bk-tip .neg{color:#f08a7a}
.bk-land{border:1px solid var(--parchment-shadow);border-left:4px solid #8a6a30;border-radius:3px;padding:.55rem .75rem;background:var(--parchment-dark);margin-bottom:.55rem}
.bk-land:last-child{margin-bottom:0}
.bk-land.home{border-left-color:var(--gold);background:#f0e0bc}
.bk-land.demesne{border-left-color:#4a7a3a}
.bk-land .h{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.bk-land .nm{font-family:'Cinzel',serif;font-size:.92rem;color:var(--ink)}
.bk-land .tag{font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);border:1px solid var(--parchment-shadow);border-radius:2px;padding:.08rem .38rem;white-space:nowrap}
.bk-land.home .tag{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.bk-land.demesne .tag{color:#2f5a22;border-color:#7aa06a}
.bk-land .sub{font-size:.84rem;color:#4a3820;margin-top:.12rem}
.bk-land .n{font-size:.8rem;color:var(--steel);font-style:italic;margin-top:.2rem;line-height:1.35}
.bk-table-wrap{overflow-x:auto}
.bk-table{width:100%;border-collapse:collapse;font-size:.9rem}
.bk-table th{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);text-align:left;font-weight:600;padding:.35rem .5rem;border-bottom:2px solid var(--parchment-shadow)}
.bk-table td{padding:.4rem .5rem;border-bottom:1px solid rgba(90,58,16,.14);vertical-align:top;color:#2a1c08}
.bk-table tbody tr:nth-child(even) td{background:rgba(201,180,138,.14)}
.bk-table tbody tr:hover td{background:rgba(212,170,69,.2)}
.bk-table .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bk-table .yr{font-family:'Cinzel',serif;font-size:.8rem}
.bk-table td:nth-child(2){white-space:nowrap}
.bk-table .net{font-weight:700}
.bk-table .nt{font-size:.82rem;font-style:italic;color:#4a3820;line-height:1.4;min-width:240px}
.bk-table .na{color:var(--steel);cursor:help}
.bk-imps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.55rem}
.bk-imp{display:flex;gap:.6rem;align-items:center;background:var(--parchment-dark);border:1px solid var(--parchment-shadow);border-radius:3px;padding:.5rem .65rem}
.bk-imp.feat{border-left:3px solid var(--gold)}
.bk-imp .ic{font-size:1.25rem;width:1.6rem;text-align:center;flex:0 0 auto}
.bk-imp .nm{font-family:'Cinzel',serif;font-size:.72rem;color:var(--ink);line-height:1.25}
.bk-imp .d{font-size:.78rem;margin-top:.1rem}
.bk-empty{font-style:italic;color:var(--steel)}
@media(max-width:860px){.bk-top{grid-template-columns:1fr}.bk{padding:1rem}}

/* ── Verdant: warm forest green parchment ── */
body.theme-verdant {
  --ink: #0e180a;
  --parchment: #eef3e8;
  --parchment-dark: #dde8d4;

/* ── Crimson: deep red-velvet parchment ── */
body.theme-crimson {
  --ink: #1a0808;
  --parchment: #f5e8e0;
  --parchment-dark: #e8d0c4;

  --gold-light: #e8b040;
  --gold-dim: #a07020;

.realm-news{margin-top:.5rem;max-width:250px}

let editingId = null;

let mode = 'conflicts';   // open on the Kingdoms map
let statusFilter = 'all';
let factionFilters = [];
let activeFamilyTab = 'Rhydian';

function saveCustom(){
  const custom = npcs.filter(n => n._custom);
  localStorage.setItem('pendragon_custom_npcs', JSON.stringify(custom));
}

function setMode(m){
  if(m==='economics'){m='estates';}
  if(m==='gm' && !gmEnabled()) m='player';
  const _rt = document.getElementById('realmTip'); if (_rt) _rt.style.display = 'none';
  mode = m;
  const modeOrder = ['player','conflicts','adventures','family','estates','gm'];
  document.querySelectorAll('.mode-btn').forEach(b => { const bm = (b.getAttribute('onclick')||'').match(/setMode\('(\w+)'\)/); b.classList.toggle('active', bm && bm[1]===m); });
  document.getElementById('gmSection').style.display = m==='gm'?'flex':'none';
  const sidebar = document.querySelector('.sidebar');
  const fullWidth = (m==='family'||m==='conflicts'||m==='estates'||m==='adventures');
  sidebar.style.display = fullWidth?'none':'';
  sidebar.classList.toggle('player-side', m==='player');
  document.getElementById('appContainer').style.gridTemplateColumns = fullWidth?'minmax(0,1fr)':'270px minmax(0,1fr)';
  render();
}

function filtered(){
  const q = (document.getElementById('searchBox')?.value||'').toLowerCase();
  return npcs.filter(n => {
    if(q && !n.name.toLowerCase().includes(q) && !(n.role||'').toLowerCase().includes(q)) return false;
    if(statusFilter !== 'all' && n.status !== statusFilter) return false;
    if(factionFilters.length > 0 && !factionFilters.includes(n.faction)) return false;
    return true;
  });
}

function getFactions(){ return [...new Set(npcs.map(n=>n.faction).filter(Boolean))]; }

function buildFactionPills(){
  const el = document.getElementById('factionPills');
  const counts = {};
  npcs.filter(n => mode==='gm' || !n.playerHidden).forEach(n => { if(n.faction) counts[n.faction] = (counts[n.faction]||0) + 1; });
  const cur = factionFilters[0] || '';
  const opts = getFactions().slice().sort((a,b) => a.localeCompare(b))
    .map(f => `<option value="${f.replace(/"/g,'&quot;')}"${f===cur?' selected':''}>${f}${counts[f] ? ' · ' + counts[f] : ''}</option>`).join('');
  el.innerHTML = `<div class="faction-row">
      <select id="factionSelect" class="faction-select" onchange="setFaction(this.value)">
        <option value="">All factions &amp; regions</option>${opts}
      </select>
      ${cur ? `<button class="faction-clear" title="Clear" onclick="setFaction('')">✕</button>` : ''}
    </div>`;
}
function setFaction(v){ factionFilters = v ? [v] : []; buildFactionPills(); render(); }

function toggleStatus(el,val){
  document.querySelectorAll('#statusPills .pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active'); statusFilter=val; render();
}

function buildList(){
  const list = document.getElementById('npcList');
  const items = filtered();
  // Fast path: if same items as before, just toggle active class
  const newSig = items.map(n=>n.id).join(',');
  if(list._sig === newSig){
    list.querySelectorAll('.npc-list-item').forEach(el=>{
      el.classList.toggle('active', parseInt(el.dataset.id)===selectedId);
    });
    return;
  }
  list._sig = newSig;
  list.innerHTML = '';
  if(!items.length){list.innerHTML='<div style="font-style:italic;font-size:.82rem;color:var(--steel);padding:.3rem 0">No souls found.</div>';return;}
  const frag = document.createDocumentFragment();
  items.forEach(n=>{
    const div=document.createElement('div');
    div.className='npc-list-item'+(selectedId===n.id?' active':'');
    div.dataset.id=n.id;
    div.innerHTML=`<span class="dot" style="background:${n.color||'#888'}"></span><div><div class="npc-list-name">${n.name}</div><div class="npc-list-sub">${n.role||n.faction||''}</div></div>`;
    div.onclick=()=>{selectedId=n.id;render();};
    frag.appendChild(div);
  });
  list.appendChild(frag);
}

    const ac=atC(n.attitude);

        ${n.appearance?`<p style="font-style:italic;color:#1e1208">${n.appearance.slice(0,90)}${n.appearance.length>90?'…':''}</p>`:(n.misc?`<p style="font-size:.82rem;color:#3d2a0e">${n.misc.slice(0,80)}${n.misc.length>80?'…':''}</p>`:'')}

// ─── MAIN RENDER ───
// Debounced render for search input — avoids full re-render on every keystroke
let _renderTimer = null;
function debouncedRender(){ clearTimeout(_renderTimer); _renderTimer = setTimeout(render, 120); }

// Cache for faction list so we don't rebuild pills on every render
let _lastFactionSig = '';
function render(){
  // Only rebuild faction pills when the faction list actually changes
  const sig = getFactions().join('|');
  if(sig !== _lastFactionSig){ buildFactionPills(); _lastFactionSig = sig; }

  if(mode!=='family'&&mode!=='conflicts'&&mode!=='estates'&&mode!=='adventures'){buildList();}
  if(mode==='gm')renderGM();
  else if(mode==='player')renderPlayer();
  else if(mode==='family')renderFamily();
  else if(mode==='estates')renderEstatesTopLevel();
  else if(mode==='conflicts')renderConflicts();
  else renderAdventures();
}

// ─── MODAL ───
function openModal(id){
  editingId=id||null;
  document.getElementById('modalTitle').textContent=id?'Edit Character':'Add New NPC';
  const n=id?npcs.find(x=>x.id===id):{};
  ['name','role','faction','age','glory','pronoun','family','appearance','personality','attitude','misc','stats','motivation','secret'].forEach(f=>{
    const el=document.getElementById('f_'+f);if(el)el.value=n[f]||'';
  });
  document.getElementById('f_status').value=n.status||'alive';
  document.getElementById('f_danger').value=n.danger||'';
  document.getElementById('f_color').value=n.color||'#8b1a1a';
  document.getElementById('gmSection').style.display=mode==='gm'?'flex':'none';
  document.getElementById('gmSection').style.flexDirection='column';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');editingId=null;}
function saveNPC(){
  const name=document.getElementById('f_name').value.trim();
  if(!name){alert('A name is required.');return;}
  const data={name,role:document.getElementById('f_role').value.trim(),faction:document.getElementById('f_faction').value.trim(),status:document.getElementById('f_status').value,color:document.getElementById('f_color').value,age:document.getElementById('f_age').value.trim(),glory:document.getElementById('f_glory').value.trim(),pronoun:document.getElementById('f_pronoun').value.trim(),family:document.getElementById('f_family').value.trim(),appearance:document.getElementById('f_appearance').value.trim(),personality:document.getElementById('f_personality').value.trim(),attitude:document.getElementById('f_attitude').value.trim(),misc:document.getElementById('f_misc').value.trim(),stats:document.getElementById('f_stats').value.trim(),motivation:document.getElementById('f_motivation').value.trim(),secret:document.getElementById('f_secret').value.trim(),danger:document.getElementById('f_danger').value,_custom:true};
  if(editingId){
    const idx=npcs.findIndex(n=>n.id===editingId);
    npcs[idx]={...npcs[idx],...data};selectedId=editingId;
  }else{
    data.id=Date.now();npcs.push(data);selectedId=data.id;
  }
  saveCustom();closeModal();render();
}
function deleteNPC(id){
  if(!confirm('Remove this character from the chronicle?'))return;
  npcs=npcs.filter(n=>n.id!==id);
  if(selectedId===id)selectedId=npcs[0]?.id||null;
  saveCustom();render();
}

  const yr = advYear !== null ? advYear : ADVENTURES[ADVENTURES.length-1].year;
  return ADVENTURES.find(a => a.year === yr) || ADVENTURES[ADVENTURES.length-1];

// Routes: one per group; a solo ride or a madness gets its own thread.
const ADV_GROUP_COL = ['#6a3a14', '#1f4f6e', '#3a5a22', '#6a1a2a'];

function advThreads(adv){
  const list = (adv.threads && adv.threads.length) ? adv.threads
             : [{id:'_', kind:'group', label:'The year', pcs:adv.pcs}];
  let g = 0;
  return list.map(th => {
    const pc = (th.pcs || [])[0];
    const col = th.kind === 'group' ? ADV_GROUP_COL[g++ % ADV_GROUP_COL.length]
              : th.kind === 'madness' ? '#7a2a6a' : (PC_TINT[pc] || '#5a4a2a');
    const dash = th.kind === 'group' ? '5 4' : th.kind === 'solo' ? '1.5 3.5' : '0.5 4';
    return Object.assign({}, th, {col, dash});
  });
}
const advThreadOf = (adv, e, ths) => ths.find(t => t.id === e.thread) || ths[0];

function buildAdventureMap(adv){
  if (typeof REALM_MAP === 'undefined') return '';
  const D = REALM_MAP;
  const ths = advThreads(adv);
  const shapes = D.realms.map(r =>
    `<path d="${r.path}" fill="#d6cbb0" fill-opacity=".72" stroke="#c2b48f" stroke-width=".7"/>`).join('');
  const lit = th => !advThread || advThread === th.id;

  // one road per thread, through its places in order
  const roads = ths.map(th => {
    const pts = adv.events.filter(e => !e.nomap && advThreadOf(adv, e, ths) === th).map(e => [e.x, e.y]);
    if (pts.length < 2) return '';
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 1; i < pts.length; i++) {
      const [x1,y1] = pts[i-1], [x2,y2] = pts[i];
      const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1;
      const len = Math.hypot(dx,dy) || 1, bow = Math.min(len*0.15, 22);
      d += ` Q${(mx - dy/len*bow).toFixed(1)},${(my + dx/len*bow).toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
    }
    const op = lit(th) ? 1 : .18;
    return `<g opacity="${op}"><path d="${d}" fill="none" stroke="#f5ead6" stroke-width="4.2" stroke-linecap="round" opacity=".85"/>
            <path d="${d}" fill="none" stroke="${th.col}" stroke-width="${th.kind === 'group' ? 1.8 : 1.6}" stroke-linecap="round" stroke-dasharray="${th.dash}"/></g>`;
  }).join('');

  const zones = adv.events.map(e => {
    if (!e.zone || e.nomap) return '';
    const th = advThreadOf(adv, e, ths);
    return `<circle cx="${e.x}" cy="${e.y}" r="${e.zone}" fill="${th.col}" fill-opacity=".1" stroke="${th.col}"
      stroke-width="1.2" stroke-dasharray="3 3" opacity="${lit(th) ? 1 : .2}"/>`;
  }).join('');

  const marks = adv.events.map((e,i) => {
    if (e.nomap) return '';
    const th = advThreadOf(adv, e, ths);
    return `
    <g style="cursor:pointer" opacity="${lit(th) ? 1 : .25}" onclick="document.getElementById('advEv${i}').scrollIntoView({behavior:'smooth',block:'center'})">
      <circle cx="${e.x}" cy="${e.y}" r="12" fill="#f5ead6" stroke="#5a4020" stroke-width="1.6"/>
      <g transform="translate(${e.x-7},${e.y-7}) scale(0.58)">
        <g fill="none" stroke="#5a4020" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          ${ADV_ICON[e.type] || ''}
        </g>
      </g>
      <circle cx="${e.x+9}" cy="${e.y-9}" r="5.6" fill="${th.col}"/>
      <text x="${e.x+9}" y="${e.y-9}" text-anchor="middle" dominant-baseline="central"
        font-family="Cinzel,serif" font-size="7" fill="#f5ead6">${i+1}</text>
      <title>${i+1}. ${e.place} — ${th.label}</title>
    </g>`;
  }).join('');

  // frame the map on the lit events, with room to breathe
  const shown = adv.events.filter(e => !e.nomap && lit(advThreadOf(adv, e, ths)));
  const fr = shown.length ? shown : adv.events.filter(e => !e.nomap);
  const xs = fr.map(e => e.x), ys = fr.map(e => e.y);
  const pad = 90;
  let vx0 = Math.min(...xs) - pad, vy0 = Math.min(...ys) - pad;
  let vw = (Math.max(...xs) - Math.min(...xs)) + pad*2;
  let vh = (Math.max(...ys) - Math.min(...ys)) + pad*2;
  const minSide = 300;
  if (vw < minSide) { vx0 -= (minSide-vw)/2; vw = minSide; }
  if (vh < minSide) { vy0 -= (minSide-vh)/2; vh = minSide; }
  const ar = 0.86;                                  // keep it roughly portrait
  if (vw/vh > 1/ar) { const t = vw*ar; vy0 -= (t-vh)/2; vh = t; }
  else { const t = vh/ar; vx0 -= (t-vw)/2; vw = t; }
  vx0 = Math.max(0, Math.min(vx0, D.w - vw)); vy0 = Math.max(0, Math.min(vy0, D.h - vh));

  return `<div class="adv-map" style="background:#cfd8d2;border:1px solid var(--parchment-shadow);border-radius:3px;padding:.4rem;flex:1 1 300px;min-width:0">
    <svg viewBox="${vx0.toFixed(0)} ${vy0.toFixed(0)} ${vw.toFixed(0)} ${vh.toFixed(0)}" style="width:100%;height:auto;display:block" role="img"
      aria-label="Map of the year's events">
      <path d="${D.coast}" fill="#efe3c6" stroke="none"/>
      ${shapes}
      <path d="${D.coast}" fill="none" stroke="#6a5535" stroke-width="1.1"/>
      ${zones}${roads}${marks}
    </svg>
  </div>`;
}

function advThreadKey(adv, ths){
  if (ths.length < 2) return '';
  return `<div style="display:flex;flex-wrap:wrap;gap:.35rem;margin:-.3rem 0 .9rem">
    ${ths.map(th => {
      const on = advThread === th.id;
      return `<button onclick="setAdvThread('${th.id}')" title="${ADV_KIND_LABEL[th.kind] || ''} — click to show only this route"
        style="display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .6rem;border-radius:2px;cursor:pointer;
        border:1px solid ${on ? th.col : 'var(--parchment-shadow)'};background:${on ? 'rgba(0,0,0,.05)' : 'var(--parchment)'};
        font-family:'IM Fell English',serif;font-size:.8rem;color:#3a2a10;opacity:${!advThread || on ? 1 : .55}">
        <svg width="26" height="8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="${th.col}" stroke-width="2.2"
          stroke-dasharray="${th.dash}" stroke-linecap="round"/></svg>
        <span style="font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:${th.col}">${ADV_KIND_LABEL[th.kind] || ''}</span>
        ${th.label}</button>`;
    }).join('')}
    ${advThread ? `<button onclick="setAdvThread(advThread)" style="padding:.25rem .6rem;border:1px solid var(--parchment-shadow);
      background:transparent;border-radius:2px;cursor:pointer;font-family:'Cinzel',serif;font-size:.6rem;color:#6a5535">Show all</button>` : ''}
  </div>`;
}

function buildAdventures(){
  const adv = currentAdv();
  if (!adv) return `<div style="padding:1.4rem;font-family:'IM Fell English',serif;font-style:italic;color:#6a4a20">
    Adventure log not loaded — check that pendragon-adventures.js is present.</div>`;
  const ths = advThreads(adv);

  const options = ADVENTURES.map(a =>

  const list = evs.map(([e,i], k) => {
    const th = advThreadOf(adv, e, ths);
    return `
    <div id="advEv${i}" style="display:flex;gap:.75rem;padding-bottom:1rem">

        <div style="width:29px;height:29px;border-radius:50%;background:var(--parchment-dark);
          border:1px solid var(--parchment-shadow);display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#5a4020" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round">${ADV_ICON[e.type] || ''}</svg>
        </div>
        ${k < evs.length-1 ? '<div style="flex:1;width:1px;background:var(--parchment-shadow);opacity:.5;margin-top:3px"></div>' : ''}
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:baseline;gap:.45rem;flex-wrap:wrap">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
            border-radius:50%;background:${th.col};color:#f5ead6;font-family:'Cinzel',serif;font-size:.55rem">${i+1}</span>
          <span style="font-family:'Cinzel',serif;font-size:.85rem;color:#2a1c08">${e.place}</span>
          <span style="font-size:.7rem;color:#8a7350;font-style:italic">${ADV_LABEL[e.type] || e.type}${e.nomap ? ' · no fixed place' : ''}${ths.length > 1 ? ` · <span style="color:${th.col}">${th.label}</span>` : ''}</span>
        </div>
        <div style="font-family:'IM Fell English',serif;font-size:.86rem;color:#4a3820;line-height:1.55;margin-top:.25rem">${e.text}</div>
      </div>
    </div>`;
  }).join('');

  return `<div style="padding:1.4rem">
    <div style="display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:.9rem">
      <select onchange="setAdvYear(this.value)" style="font-family:'Cinzel',serif;font-size:.82rem;
        padding:.45rem .7rem;border:1px solid var(--parchment-shadow);border-radius:2px;
        background:var(--parchment-dark);color:var(--ink);cursor:pointer;letter-spacing:.03em">${options}</select>
      <div style="display:flex;gap:.25rem">${badges}</div>
    </div>
    <div style="font-family:'IM Fell English',serif;font-style:italic;color:#3a2008;font-size:.9rem;
      line-height:1.55;margin-bottom:1.1rem">${adv.summary}</div>
    ${advThreadKey(adv, ths)}
    <div style="display:flex;flex-wrap:wrap;gap:1.2rem;align-items:flex-start">
      ${buildAdventureMap(adv)}
      <div style="flex:1 1 330px;min-width:0">${list}</div>
    </div>
  </div>`;
}

// Britain 494. Logres counties follow Book of the Warlord; the rest are as before.
let selectedRealm = null;
let realmLabelMode = 'all'; // 'all' | 'logres' | 'none'
let realmShade = 'stance'; // 'stance' | 'logres'

const REALM_TINT = {

  hostile:  '#8b1a1a', contested:'#b05a20', home:     '#1d6b34'
};
// NPC faction strings from the roll, mapped onto the realms of the map.

// Berroc and Thamesmouth folded into Silchester when the map was drawn
REALM_FACTION.silchester = ['Silchester','Berroc','Thamesmouth'];

function realmNpcs(rid){
  if (typeof SPREADSHEET_NPCS === 'undefined') return [];
  const keys = REALM_FACTION[rid];
  if (!keys || !keys.length) return [];
  const showHidden = (typeof mode !== 'undefined' && mode === 'gm');
  return SPREADSHEET_NPCS
    .filter(n => keys.includes(n.faction))
    .filter(n => showHidden || n.playerVisible)
    .sort((a,b) => (a.status==='dead') - (b.status==='dead')
                || (parseInt(b.glory||0,10) - parseInt(a.glory||0,10)));
}

// Why a realm carries two names. Read either aloud; the map shows both.
const ALT_NOTE = {
  caercolun: 'Caercolun to the Britons, Essex to the Saxons who will hold it',
  caerwent:  'Caerwent to the Britons, Anglia to the Saxons who will hold it',
  linden:    'Linden in the Book of the Warlord, Lindsey in the Great Pendragon Campaign',
  gentian:   'Gentian in the Book of the Warlord, Marlboro in the Great Pendragon Campaign',
  hantonne:  'Hantonne in the Book of the Warlord, Hampshire in the Great Pendragon Campaign',
  dorsette:  'Dorsette in the Book of the Warlord, Dorset in the Great Pendragon Campaign',
  hartland:  'Hartland in the Book of the Warlord, Hertford in the Great Pendragon Campaign',
  huntland:  'Huntland in the Book of the Warlord, Huntington in the Great Pendragon Campaign',
  glevum:    'Glevum in the Book of the Warlord, Gloucester in the Great Pendragon Campaign',


};
const REALM_STANCE_LABEL = {
  hegemon:'Suzerain', crown:'Crown-held', loyal:'Loyal', cautious:'Cautious',
  neutral:'Neutral', rival:'Rival', hostile:'Hostile', contested:'Contested', home:'PC Home'
};

// Redraw only the map block, so the page keeps its scroll position.
function refreshRealmMap(){
  const el = document.getElementById('realmMapBlock');
  if (!el) { renderConflicts(); return; }
  const y = window.scrollY;
  el.outerHTML = buildRealmMap();
  window.scrollTo(0, y);
}
function realmHover(e, id){
  let tip = document.getElementById('realmTip');
  if (!tip){ tip = document.createElement('div'); tip.id = 'realmTip'; document.body.appendChild(tip); }
  if (!e){ tip.style.display = 'none'; return; }
  const r = REALM_MAP.realms.find(x => x.id === id); if (!r) return;
  if (tip.dataset.id !== id){
    tip.dataset.id = id;
    const col = r.hidden ? '#9ab08a' : (REALM_TINT[r.stance] || REALM_TINT.neutral);
    const n = r.hidden ? 0 : realmNpcs(r.id).length;
    tip.innerHTML = r.hidden
      ? `<b>Forest Sauvage</b><div class="st" style="color:${col}">Unmapped</div><div class="nt">Faerie-held woodland.</div>`
      : `<b>${r.name}</b>${r.alt ? ` <span class="al">· ${r.alt}</span>` : ''}
         <div class="st" style="color:${col};filter:brightness(1.6)">${REALM_STANCE_LABEL[r.stance] || r.stance}${r.logres ? ' · Logres' : ''}</div>
         ${r.ruler ? `<div>${r.ruler}</div>` : ''}
         ${r.note ? `<div class="nt">${r.note}</div>` : ''}
         <div class="ft">${n ? n + ' known there · ' : ''}click to pin</div>`;
  }
  tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = e.clientX - w - 16;
  if (y + h > innerHeight - 8) y = e.clientY - h - 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function selectRealm(id){
  selectedRealm = (selectedRealm === id) ? null : id;
  refreshRealmMap();
}
function setRealmLabels(m){ realmLabelMode = m; refreshRealmMap(); }
function setRealmShade(m){ realmShade = m; refreshRealmMap(); }

function buildRealmMap(){
  if (typeof REALM_MAP === 'undefined') {
    return `<div style="padding:1rem;font-family:'IM Fell English',serif;font-style:italic;color:#6a4a20">
      Map data not loaded — check that pendragon-realms.js is present.</div>`;
  }
  const D = REALM_MAP;
  const tint = r => REALM_TINT[r.stance] || REALM_TINT.neutral;

  const byLogres = realmShade === 'logres';
  const shapes = D.realms.map(r => {
    const on  = selectedRealm === r.id;
    if (r.hidden) {
      return `<path d="${r.path}" fill="#3c4a33" fill-opacity="${on ? 0.8 : 0.55}"
        stroke="${on ? '#3a2008' : '#7d8a6e'}" stroke-width="${on ? 2.2 : 0.9}" stroke-dasharray="4 3"
        stroke-linejoin="round" style="cursor:pointer" onclick="selectRealm('${r.id}')"
        onmousemove="realmHover(event,'${r.id}')" onmouseleave="realmHover(null)"></path>`;
    }
    const col = byLogres ? (r.logres ? '#b8902a' : '#6f7a63') : tint(r);
    const op  = on ? 0.92 : (byLogres ? (r.logres ? 0.72 : 0.30)
              : (r.stance === 'home' ? 0.85 : (r.logres ? 0.62 : 0.42)));
    return `<path d="${r.path}" fill="${col}" fill-opacity="${op}"
      stroke="${on ? '#3a2008' : '#f5ead6'}" stroke-width="${on ? 2.2 : 0.8}"
      stroke-linejoin="round" style="cursor:pointer;transition:fill-opacity .12s"
      onclick="selectRealm('${r.id}')" onmousemove="realmHover(event,'${r.id}')" onmouseleave="realmHover(null)"></path>`;
  }).join('');

  const showLabel = r => !r.hidden && (realmLabelMode === 'all' || (realmLabelMode === 'logres' && r.logres));
  const hid = D.realms.filter(r => r.hidden);
  const forestLabel = (realmLabelMode !== 'none' && hid.length)
    ? `<text x="${hid.reduce((a,r)=>a+r.cx,0)/hid.length}" y="${hid.reduce((a,r)=>a+r.cy,0)/hid.length}"
        text-anchor="middle" dominant-baseline="middle" font-family="'IM Fell English',Cinzel,serif"
        font-size="10" font-style="italic" fill="#33422b" paint-order="stroke" stroke="#cfd6c4"
        stroke-width="2.6" stroke-linejoin="round" pointer-events="none">Forest Sauvage</text>` : '';
  const labels = D.realms.filter(showLabel).map(r => {
    const fs = r.logres ? 10.5 : 9.5;
    const dy = r.alt ? -3.2 : 0;
    const main = `<text x="${r.cx}" y="${r.cy + dy}" text-anchor="middle" dominant-baseline="middle"
      font-family="Cinzel,serif" font-size="${fs}"
      fill="#2a1c08" paint-order="stroke" stroke="#f5ead6" stroke-width="2.6"
      stroke-linejoin="round" pointer-events="none">${r.name}</text>`;
    // both spellings, so either book can be read aloud without confusing anyone
    const second = r.alt ? `<text x="${r.cx}" y="${r.cy + dy + fs*0.92}" text-anchor="middle"
      dominant-baseline="middle" font-family="Cinzel,serif" font-size="${(fs*0.78).toFixed(1)}"
      fill="#6a5535" paint-order="stroke" stroke="#f5ead6" stroke-width="2.2"
      stroke-linejoin="round" pointer-events="none">${r.alt}</text>` : '';
    return main + second;
  }).join('');

  let wall = '';
  if (D.wall && D.wall.length > 1) {
    const W0 = D.wall;
    // walk the line, dropping a tick every few units on the northern side
    const ticks = [];
    const step = 7;
    for (let i = 0; i < W0.length - 1; i++) {
      const [x1,y1] = W0[i], [x2,y2] = W0[i+1];
      const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy);
      const ux = dx/len, uy = dy/len, nx = uy, ny = -ux;   // unit normal, northward
      for (let d = 0; d < len; d += step) {
        const px = x1+ux*d, py = y1+uy*d;
        ticks.push(`M${px.toFixed(1)},${py.toFixed(1)} L${(px+nx*4.2).toFixed(1)},${(py+ny*4.2).toFixed(1)}`);
      }
    }
    const pts = W0.map(p => p.join(',')).join(' ');
    const mid = W0[Math.floor(W0.length/2)];
    const [ax,ay] = W0[0], [bx,by] = W0[W0.length-1];
    const ang = Math.atan2(by-ay, bx-ax) * 180/Math.PI;
    wall = `
      <polyline points="${pts}" fill="none" stroke="#f0e6cf" stroke-width="5.4"
        stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
      <path d="${ticks.join(' ')}" fill="none" stroke="#3a2008" stroke-width="1.5"
        stroke-linecap="round" opacity=".9"/>
      <polyline points="${pts}" fill="none" stroke="#3a2008" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
      <text x="${mid[0]}" y="${mid[1] - 11}" text-anchor="middle"
        transform="rotate(${ang.toFixed(1)} ${mid[0]} ${mid[1] - 11})"
        font-family="Cinzel,serif" font-size="9" letter-spacing="1.6" fill="#3a2008"
        paint-order="stroke" stroke="#f0e6cf" stroke-width="3" stroke-linejoin="round"
        pointer-events="none">HADRIAN'S WALL</text>`;
  }

  const sel = selectedRealm ? D.realms.find(r => r.id === selectedRealm) : null;
  const detail = sel ? `
    <div class="realm-card" style="border-left:4px solid ${sel.hidden ? '#3c4a33' : tint(sel)}">
      <button class="realm-x" title="Close" onclick="selectRealm('${sel.id}')">✕</button>
      <div style="font-family:'Cinzel',serif;font-size:1rem;color:#2a1c08;letter-spacing:.04em;padding-right:1.4rem">${sel.hidden ? 'Forest Sauvage' : sel.name}</div>
      ${sel.hidden ? `<div style="font-size:.74rem;color:#4a5a3a;font-style:italic">no county is known to lie here in 494</div>` : ''}
      ${sel.alt ? `<div style="font-size:.74rem;color:#6a5a3a;font-style:italic">also known as ${sel.alt}${ALT_NOTE[sel.id] ? ' \u2014 ' + ALT_NOTE[sel.id] : ''}</div>` : ''}
      <div style="font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:${sel.hidden ? '#4a5a3a' : tint(sel)};margin-top:.45rem">
        ${sel.hidden ? 'Unmapped' : (REALM_STANCE_LABEL[sel.stance] || sel.stance) + (sel.logres ? ' · County of Logres' : '')}</div>
      ${(sel.ruler && !sel.hidden) ? `<div style="font-size:.84rem;color:#3a2008;margin-top:.35rem">${sel.ruler}</div>` : ''}
      ${sel.note ? `<div style="font-family:'IM Fell English',serif;font-style:italic;font-size:.82rem;color:#5a4020;margin-top:.35rem;line-height:1.4">${sel.hidden ? 'Faerie-held woodland. Whatever lies within is not known to the wider world, and will not be until the forest is opened.' : sel.note}</div>` : ''}
      ${(() => {
        if (sel.hidden) return '';
        const ns = realmNpcs(sel.id);
        if (!ns.length) return '';
        return `<div style="margin-top:.7rem;padding-top:.55rem;border-top:1px solid var(--parchment-shadow)">

}

let editingRelId = null;
function openAddRelModal(relId){
  editingRelId = relId || null;
  document.getElementById('relModalTitle').textContent = relId ? 'Edit Relationship' : 'Add Relationship';
  document.getElementById('relDeleteBtn').style.display = relId ? 'inline-block' : 'none';
  // Refresh selects with latest NPC list
  ['rel_a','rel_b'].forEach(id => {
    document.getElementById(id).innerHTML = involvedNpcSelectOpts();
  });
  if(relId){
    const r = RELATIONS.find(x=>x.id===relId);
    if(r){
      document.getElementById('rel_a').value = r.a;
      document.getElementById('rel_b').value = r.b;
      document.getElementById('rel_type').value = r.type;
      document.getElementById('rel_label').value = r.label||'';
      const scopeEl = document.getElementById('rel_scope');
      [...scopeEl.options].forEach(o => o.selected = (r.scope||[]).includes(o.value));
    }
  } else {
    document.getElementById('rel_a').value='';
    document.getElementById('rel_b').value='';
    document.getElementById('rel_type').value='hostile';
    document.getElementById('rel_label').value='';
  }
  const ov = document.getElementById('relModalOverlay');
  ov.style.display='flex';
}
function closeRelModal(){ document.getElementById('relModalOverlay').style.display='none'; editingRelId=null; }
function saveRelation(){
  const a=document.getElementById('rel_a').value.trim();
  const b=document.getElementById('rel_b').value.trim();
  if(!a||!b||a===b){alert('Please select two different characters.');return;}
  const type=document.getElementById('rel_type').value;
  const label=document.getElementById('rel_label').value.trim();
  const scopeEl=document.getElementById('rel_scope');
  const scope=[...scopeEl.options].filter(o=>o.selected).map(o=>o.value);
  if(editingRelId){
    const idx=RELATIONS.findIndex(r=>r.id===editingRelId);
    RELATIONS[idx]={...RELATIONS[idx],a,b,type,label,scope};
  } else {
    RELATIONS.push({id:'r'+Date.now(),a,b,type,label,scope});
  }
  saveRelations(); closeRelModal(); renderConflicts();
}
function deleteRelation(){
  if(!editingRelId)return;
  if(!confirm('Remove this relationship?'))return;
  RELATIONS=RELATIONS.filter(r=>r.id!==editingRelId);
  saveRelations(); closeRelModal(); renderConflicts();
}

function toggleConflictScope(s){
  const i=conflictFilter.scopes.indexOf(s);
  if(i>=0) conflictFilter.scopes.splice(i,1); else conflictFilter.scopes.push(s);
  renderConflicts();
}
function toggleConflictType(t){
  const i=conflictFilter.types.indexOf(t);
  if(i>=0) conflictFilter.types.splice(i,1); else conflictFilter.types.push(t);
  renderConflicts();
}

// ── Force-directed graph engine ──
let webNodes=[], webEdges=[], webAnim=null, webDrag=null, webSelected=null;

function initConflictWeb(){
  const canvas = document.getElementById('conflictCanvas');
  if(!canvas) return;

  const container = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const W = container.clientWidth || 900;
  const H = Math.max(720, container.clientHeight || 720);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx2 = canvas.getContext('2d');
  ctx2.scale(dpr, dpr);

  // Filter relations
  let rels = RELATIONS.filter(r => {
    if(conflictFilter.scopes.length && !r.scope.some(s=>conflictFilter.scopes.includes(s))) return false;
    if(conflictFilter.types.length && !conflictFilter.types.includes(r.type)) return false;
    if(conflictFilter.focusNpc && r.a!==conflictFilter.focusNpc && r.b!==conflictFilter.focusNpc) return false;
    return true;
  });

  // Build node set from filtered relations
  const nodeNames = [...new Set(rels.flatMap(r=>[r.a,r.b]))];
  webNodes = nodeNames.map(name => {
    const npc = npcs.find(n=>n.name===name);
    const glory = parseInt(npc?.glory)||0;
    const r = 10 + Math.min(glory/800, 12);
    const faction = npc?.faction||'Other';
    const existing = (webNodes||[]).find(n=>n.name===name);
    return {
      name, faction,
      x: existing ? existing.x : W/2 + (Math.random()-.5)*W*0.6,
      y: existing ? existing.y : H/2 + (Math.random()-.5)*H*0.5,
      vx:0, vy:0, r,
      color: FACTION_NODE_COLORS[faction]||'#2a2a2a',
      portrait: PORTRAITS[name]||null,
      pinned: existing?.pinned||false,
      _img: existing?._img||null,
    };
  });
  webEdges = rels;

  // Preload portrait images for canvas
  webNodes.forEach(node => {
    if(node.portrait && !node._img){
      const img = new Image();
      img.onload = ()=>{ node._img=img; drawWeb(); };
      img.src = node.portrait;
    }
  });

  // Stop any previous animation
  if(webAnim) cancelAnimationFrame(webAnim);

  // Canvas interaction
  canvas.onmousedown = e => {
    const {x,y} = canvasPos(e,canvas);
    const hit = webNodes.find(n => dist(n,{x,y})<n.r+4);
    if(hit){ webDrag={node:hit,ox:x-hit.x,oy:y-hit.y}; hit.pinned=true; canvas.style.cursor='grabbing'; }
  };
  canvas.onmousemove = e => {
    const {x,y} = canvasPos(e,canvas);
    if(webDrag){ webDrag.node.x=x-webDrag.ox; webDrag.node.y=y-webDrag.oy; }
    else { const hit=webNodes.find(n=>dist(n,{x,y})<n.r+4); canvas.style.cursor=hit?'pointer':'grab'; }
  };
  canvas.onmouseup = e => {
    if(webDrag){ webDrag=null; canvas.style.cursor='grab'; }
  };
  canvas.onclick = e => {
    const {x,y} = canvasPos(e,canvas);
    const hit = webNodes.find(n => dist(n,{x,y})<n.r+4);
    if(hit){ webSelected=hit.name===webSelected?null:hit.name; showConflictDetail(webSelected); drawWeb(); }
    else { webSelected=null; showConflictDetail(null); drawWeb(); }
  };

  // Double-click pin toggle
  canvas.ondblclick = e => {
    const {x,y} = canvasPos(e,canvas);
    const hit = webNodes.find(n=>dist(n,{x,y})<n.r+4);
    if(hit) hit.pinned=!hit.pinned;
  };

  runSimulation(W,H);
}

function canvasPos(e,canvas){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function runSimulation(W,H){
  let tick=0;
  // Build name→node Map once per sim for O(1) edge lookups
  const _webNodeMap = new Map(webNodes.map(n=>[n.name,n]));
  function step(){
    tick++;
    const cooling = Math.max(0.05, 1 - tick/400);

    // Forces
    webNodes.forEach(n=>{ n.fx=0; n.fy=0; });

    // Repulsion between all node pairs
    for(let i=0;i<webNodes.length;i++){
      for(let j=i+1;j<webNodes.length;j++){
        const a=webNodes[i],b=webNodes[j];
        const dx=b.x-a.x, dy=b.y-a.y;
        const d=Math.max(1,Math.hypot(dx,dy));
        const strength=3200/(d*d);
        a.fx-=dx/d*strength; a.fy-=dy/d*strength;
        b.fx+=dx/d*strength; b.fy+=dy/d*strength;
      }
    }

    // Edge attraction (spring)
    // _webNodeMap built outside step loop for O(1) lookups
    webEdges.forEach(edge=>{
      const a=_webNodeMap.get(edge.a);
      const b=_webNodeMap.get(edge.b);
      if(!a||!b) return;
      const dx=b.x-a.x, dy=b.y-a.y;
      const d=Math.max(1,Math.hypot(dx,dy));
      const ideal=120;
      const f=(d-ideal)*0.035;
      a.fx+=dx/d*f; a.fy+=dy/d*f;
      b.fx-=dx/d*f; b.fy-=dy/d*f;
    });

    // Gravity towards centre
    webNodes.forEach(n=>{
      n.fx+=(W/2-n.x)*0.018;
      n.fy+=(H/2-n.y)*0.018;
    });

    // Integrate
    webNodes.forEach(n=>{
      if(n.pinned||webDrag?.node===n) return;
      n.vx=(n.vx+n.fx)*0.72*cooling;
      n.vy=(n.vy+n.fy)*0.72*cooling;
      n.x=Math.max(n.r+4, Math.min(W-n.r-4, n.x+n.vx));
      n.y=Math.max(n.r+4, Math.min(H-n.r-4, n.y+n.vy));
    });

    drawWeb();
    webAnim=requestAnimationFrame(step);
  }
  webAnim=requestAnimationFrame(step);
}

function drawWeb(){
  const canvas=document.getElementById('conflictCanvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);

  // Background
  ctx.fillStyle='#0d0a06';
  ctx.fillRect(0,0,W,H);

  // Build fast lookups for draw
  const _drawNodeMap = new Map(webNodes.map(n=>[n.name,n]));
  const _connSet = webSelected
    ? new Set(webEdges.flatMap(e=>(e.a===webSelected||e.b===webSelected)?[e.a,e.b]:[]))
    : null;

  // Draw edges
  webEdges.forEach(edge=>{
    const a=_drawNodeMap.get(edge.a);
    const b=_drawNodeMap.get(edge.b);
    if(!a||!b) return;
    const isSelected = webSelected && (edge.a===webSelected||edge.b===webSelected);
    const isDimmed = webSelected && !isSelected;
    ctx.globalAlpha = isDimmed ? 0.08 : isSelected ? 1 : 0.55;

    const color = REL_COLORS[edge.type]||'#888';
    ctx.strokeStyle=color;
    ctx.lineWidth= isSelected ? 2.5 : 1.5;

    // Dashed for scheme/complex
    if(edge.type==='scheme') ctx.setLineDash([5,4]);
    else if(edge.type==='complex') ctx.setLineDash([2,3]);
    else ctx.setLineDash([]);

    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Edge label on hover/selected
    if(isSelected && edge.label){
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const maxW=160;
      ctx.globalAlpha=0.92;
      ctx.font='10px serif';
      // Wrap text
      const words=edge.label.split(' ');
      const lines=[]; let line='';
      words.forEach(w=>{ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW){lines.push(line);line=w;}else{line=t;} });
      if(line)lines.push(line);
      const lh=13, pad=5;
      const bh=lines.length*lh+pad*2, bw=maxW+pad*2;
      ctx.fillStyle='rgba(10,8,4,0.88)';
      roundRect(ctx,mx-bw/2,my-bh/2,bw,bh,3);
      ctx.fill();
      ctx.fillStyle=color;
      lines.forEach((l,i)=>{ ctx.fillText(l,mx-maxW/2,my-bh/2+pad+lh*(i+0.85)); });
    }
    ctx.globalAlpha=1;
  });

  // Draw nodes
  webNodes.forEach(node=>{
    const isSelected = node.name===webSelected;
    const isDimmed = webSelected && !isSelected && !(_connSet&&_connSet.has(node.name));
    ctx.globalAlpha = isDimmed ? 0.2 : 1;

    const r=node.r;

    // Outer glow for selected
    if(isSelected){
      ctx.shadowColor='#d4aa45'; ctx.shadowBlur=18;
    }

    // Node circle background
    ctx.fillStyle=node.color;
    ctx.beginPath(); ctx.arc(node.x,node.y,r,0,Math.PI*2); ctx.fill();

    // Portrait clip
    if(node._img){
      ctx.save();
      ctx.beginPath(); ctx.arc(node.x,node.y,r-1,0,Math.PI*2); ctx.clip();
      ctx.drawImage(node._img,node.x-r+1,node.y-r+1,(r-1)*2,(r-1)*2);
      ctx.restore();
    }

    // Node border
    ctx.shadowBlur=0;
    ctx.strokeStyle = isSelected ? '#d4aa45' : '#c9b48a';
    ctx.lineWidth = isSelected ? 2.5 : 1;
    ctx.beginPath(); ctx.arc(node.x,node.y,r,0,Math.PI*2); ctx.stroke();

    // Name label
    ctx.fillStyle = isDimmed ? '#555' : '#e8d5b0';
    ctx.font = `${isSelected?'bold ':''} ${Math.max(9,r*0.62)}px 'Cinzel',serif`;
    ctx.textAlign='center';
    const label = node.name.length>14 ? node.name.slice(0,13)+'…' : node.name;
    ctx.fillText(label, node.x, node.y+r+12);

    ctx.globalAlpha=1;
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function showConflictDetail(name){
  const panel=document.getElementById('conflictDetail');
  if(!panel)return;
  if(!name){
    panel.innerHTML=`<div style="font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.14em;color:var(--steel);text-transform:uppercase;margin-bottom:.8rem">Select a character to inspect</div><div style="font-family:'IM Fell English',serif;font-style:italic;color:#3a2008;font-size:.82rem">Click any node in the web to see their full list of relationships.</div>`;
    return;
  }
  const npc=npcs.find(n=>n.name===name);
  const portrait=PORTRAITS[name];
  const rels=RELATIONS.filter(r=>r.a===name||r.b===name);

  const relHtml=rels.length ? rels.map(r=>{
    const other=r.a===name?r.b:r.a;
    const col=REL_COLORS[r.type]||'#888';
    const scopeTags=(r.scope||[]).map(s=>`<span style="font-size:.6rem;padding:.1rem .35rem;border-radius:2px;background:${SCOPE_COLORS[s]}22;color:${SCOPE_COLORS[s]};border:1px solid ${SCOPE_COLORS[s]}55">${s}</span>`).join(' ');
    return `<div style="border:1px solid ${col}44;border-left:3px solid ${col};border-radius:2px;padding:.6rem .7rem;margin-bottom:.5rem;background:rgba(0,0,0,.1)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem">
        <span style="font-family:'Cinzel',serif;font-size:.78rem;color:${col}">${REL_LABELS[r.type]||r.type}</span>
        <div style="display:flex;gap:.25rem">${scopeTags}</div>
      </div>
      <div style="font-family:'Cinzel',serif;font-size:.82rem;color:#e8d5b0;margin-bottom:.25rem;cursor:pointer" onclick="webSelected='${other}';showConflictDetail('${other}');drawWeb()">↔ ${other}</div>
      ${r.label?`<div style="font-size:.8rem;font-style:italic;color:#3d2a0e;line-height:1.4">${r.label}</div>`:''}
      <button onclick="openAddRelModal('${r.id}')" style="margin-top:.4rem;font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.08em;padding:.18rem .5rem;background:transparent;border:1px solid var(--parchment-shadow);border-radius:2px;cursor:pointer;background:rgba(0,0,0,.06);color:#3a2008;font-weight:500;--steel)">Edit</button>
    </div>`;
  }).join('') : `<div style="font-style:italic;color:#3d2a0e;font-size:.82rem">No recorded relationships.</div>`;

  panel.innerHTML=`
    ${portrait?`<img src="${portrait}" style="width:100%;height:110px;object-fit:cover;object-position:top;border-radius:2px;margin-bottom:.8rem">`:''}
    <div style="font-family:'Cinzel',serif;font-size:1rem;color:#e8d5b0;margin-bottom:.15rem">${name}</div>
    ${npc?`<div style="font-size:.78rem;color:#4a3010;font-style:italic;margin-bottom:.1rem">${npc.role||''}</div><div style="font-size:.72rem;color:var(--steel);margin-bottom:.8rem">${npc.faction||''}</div>`:''}
    <div style="font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.12em;color:var(--steel);text-transform:uppercase;margin-bottom:.5rem">${rels.length} Relationship${rels.length!==1?'s':''}</div>
    ${relHtml}
    <button onclick="openAddRelModal()" style="margin-top:.8rem;width:100%;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;padding:.35rem;background:var(--forest);color:var(--parchment);border:1px solid #3a6a3a;border-radius:2px;cursor:pointer">+ Add Relationship with ${name.split(' ')[0]}</button>
  `;
}
