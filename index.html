    <symbol id="slStones" viewBox="-8 -6 16 10" overflow="visible">
      <g fill="#a99d86" stroke="${HOLD_INK}" stroke-width=".6"><path d="M-7 3.6v-5h1.6v5zM-3.6 3.6v-5H-2v5zM-7.4-2.4h5.8v-1.3h-5.8z"/>
      <path d="M2 3.6v-5h1.6v5zM5.4 3.6v-5H7v5zM1.6-2.4h5.8v-1.3H1.6z"/><path d="M-.9 3.6V-.4h1.8v4z"/></g></symbol>
    <symbol id="slFort" viewBox="-7 -6 14 10" overflow="visible">
      <ellipse cx="0" cy="0" rx="6.4" ry="3.9" fill="none" stroke="${HOLD_INK}" stroke-width="1.1"/>
      <ellipse cx="0" cy="0" rx="4" ry="2.3" fill="none" stroke="${HOLD_INK}" stroke-width=".6" stroke-dasharray="1 .8"/></symbol>
  </defs>`;

  const frame = `M0,0H${W}V${H}H0Z`;
  const paper = `<rect width="${W}" height="${H}" fill="${HOLD_PAPER}"/>
    <path d="${frame}${D.county}" fill="#cdbb94" fill-opacity=".5" fill-rule="evenodd"/>`;

  const hund = D.hundreds.map((h, i) => {
    const [c, o] = lordTint(h.lord);
    return `<path d="${h.path}" fill="${c}" fill-opacity="${o}" stroke="#9a7048" stroke-opacity=".6"
      stroke-width=".9" stroke-dasharray=".1 2.6" stroke-linecap="round" stroke-linejoin="round"
      onmousemove="holdHover(event,'h',${i})" onmouseleave="holdHover(null)"/>`;
  }).join('');

  const use = (id, pts, w, h) => pts.map(([x,y]) => `<use href="#${id}" x="${(x-w/2).toFixed(1)}" y="${(y-h/2).toFixed(1)}" width="${w}" height="${h}"/>`).join('');
  const terrain = `<g pointer-events="none">
    <path d="${D.hills}" fill="#dcbf98" fill-opacity=".45"/>
    <path d="${D.forest}" fill="#b3c196" fill-opacity=".75" stroke="#7d9262" stroke-opacity=".6" stroke-width=".8"/>
    ${use('slGrass', D.grass, 6, 4)}${use('slHill', D.hillmarks, 16, 7)}${use('slTree', D.trees, 8.4, 9.2)}</g>`;

  const rivers = D.rivers.map((r, i) => `
    <path d="${r.path}" fill="none" stroke="${HOLD_PAPER}" stroke-width="${(r.w*0.95+1.6).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>
    <path id="slRiv${i}" d="${r.path}" fill="none" stroke="#6f97b8" stroke-width="${(r.w*0.95).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`).join('');
  const riverNames = D.rivers.map((r, i) => (r.name && r.lo) ? `<text font-family="'IM Fell English',serif" font-style="italic"

  const roads = D.roads.map(r => {

  }).join('');
  const roadLabels = D.roads.filter(r => r.label && r.lx).map(r => `<text x="${r.lx}" y="${r.ly}" dy="-3"

  // Ambrosius' Dike: a bank with ticks on its southern face
  const dk = D.dike; let ticks = '';
  for (let i = 0; i < dk.length - 1; i++){
    const [x1,y1] = dk[i], [x2,y2] = dk[i+1], dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy);
    const ux = dx/len, uy = dy/len, nx = -uy, ny = ux;
    for (let d = 0; d < len; d += 4.5){
      const px = x1+ux*d, py = y1+uy*d;
      ticks += `M${px.toFixed(1)},${py.toFixed(1)}l${(nx*3.2).toFixed(1)},${(ny*3.2).toFixed(1)}`;
    }
  }
  const dike = `<g pointer-events="none"><path d="M${dk.map(p => p.join(',')).join('L')}" fill="none" stroke="#4a3622" stroke-width="2" stroke-linejoin="round"/>
    <path d="${ticks}" stroke="#4a3622" stroke-width=".9"/>
    <text x="${dk[3][0]}" y="${dk[3][1]-6}" font-family="'IM Fell English',serif" font-style="italic" font-size="9"
      fill="#4a3622" paint-order="stroke" stroke="${HOLD_PAPER}" stroke-width="2.2" transform="rotate(8 ${dk[3][0]} ${dk[3][1]})">Ambrosius' Dike</text></g>`;

  const border = `<path d="${D.county}" fill="none" stroke="${HOLD_PAPER}" stroke-width="5" stroke-opacity=".7" pointer-events="none"/>
    <path d="${D.county}" fill="none" stroke="#7a3b1a" stroke-width="1.6" stroke-dasharray="7 2.5 1.5 2.5" stroke-linejoin="round" pointer-events="none"/>`;

  const hundLabels = D.hundreds.filter(h => h.lx).map(h => `<text x="${h.lx}" y="${h.ly}" text-anchor="middle"

  const forestLabels = D.forestNames.map(f => `<text x="${f.x}" y="${f.y}" text-anchor="middle" font-family="'IM Fell English',serif"

  const neighbours = [['GENTIAN',V[0]+V[2]*0.62,V[1]+11,0],['SILCHESTER',V[0]+V[2]-11,V[1]+V[3]*0.3,90],

    .map(([n,x,y,r]) => `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="Cinzel,serif" font-size="12"
      letter-spacing="6" fill="#6a5535" fill-opacity=".6" paint-order="stroke" stroke="${HOLD_PAPER}" stroke-width="2.5" stroke-opacity=".7"

  const placeSym = p => p.kind === 'Castle' ? (/Sarum/.test(p.n) ? ['slCity', 22, 20] : ['slCastle', 15, 15])
    : p.kind === 'Site' ? (/Stonehenge/.test(p.n) ? ['slStones', 15, 10] : ['slFort', 13, 9])

  const places = D.places.map((p, i) => {
    const [sym, sw, sh] = placeSym(p), big = /Sarum/.test(p.n), fs = big ? 9.5 : 7.8, s = big ? 9 : 6.5;
    const lp = p.lp || 'b';
    let tx = p.x, ty = p.y + s + fs, anc = 'middle';
    if (lp === 't') ty = p.y - s - 2 - (p.alt ? 7 : 0);

    return `<g style="cursor:help" onmousemove="holdHover(event,'p',${i})" onmouseleave="holdHover(null)">

      <text x="${tx}" y="${ty}" text-anchor="${anc}" font-family="Cinzel,serif" font-weight="700"
        font-size="${fs}" fill="${HOLD_INK}" paint-order="stroke" stroke="${HOLD_PAPER}" stroke-width="2.4">${hEsc(p.n)}</text>
      ${p.alt ? `<text x="${tx}" y="${ty + 7}" text-anchor="${anc}" font-family="'IM Fell English',serif" font-style="italic"
        font-size="6.3" fill="#6a5535" paint-order="stroke" stroke="${HOLD_PAPER}" stroke-width="2">${hEsc(p.alt)}</text>` : ''}
    </g>`;
  }).join('');

  const regions = (D.regionLabels || []).map(r => `<text x="${r.x}" y="${r.y}" text-anchor="middle" transform="rotate(${r.rot || 0} ${r.x} ${r.y})"

      paint-order="stroke" stroke="${HOLD_PAPER}" stroke-width="2.6" pointer-events="none">${hEsc(r.text)}</text>`).join('');
  const showName = m => holdLabels === 'all' || (holdLabels === 'lords' && (/^pc_/.test(holderClass(m.holder)) || ['elad','hywel','knight'].includes(holderClass(m.holder))));
  const manors = D.manors.map((m, i) => {
    const c = HOLD_BY_ID[holderClass(m.holder)], off = dim(c.id), pc = !!c.pc;

    return `<g style="cursor:pointer" opacity="${off ? .2 : 1}" onmousemove="holdHover(event,'m',${i})" onmouseleave="holdHover(null)"

      ${showName(m) ? `<text ${holdLabelPos(m, 4.2)} font-family="'Crimson Pro',Georgia,serif" font-size="${m.fs || 6.4}"

  // map key cartouche (fills the empty south-west, as on the Krijger map)
  const K = D.key, kx = K.x, ky = K.y;
  const krow = (i, sym, label, w = 10, h = 10, extra = '') => `<use href="#${sym}" x="${kx+14-w/2}" y="${ky+31+i*12.6-h/2}" width="${w}" height="${h}" ${extra}/>

  const kline = (i, dash, label, wide) => `${wide ? `<path d="M${kx+7},${ky+31+i*12.6}h14" stroke="${HOLD_PAPER}" stroke-width="3.6"/>` : ''}

      <text x="${kx+26}" y="${ky+34+i*12.6}" font-family="'Crimson Pro',Georgia,serif" font-size="7.4" fill="${HOLD_INK}">${label}</text>`;
  const key = `<g pointer-events="none">

    ${krow(1,'slFlag','Player knight’s home manor',10,13)}
    ${krow(2,'slCastle','Castle',12,12)}${krow(3,'slTown','Town',13,9)}${krow(4,'slAbbey','Abbey',12,11)}

    <path d="M${kx+7},${ky+31+7*12.6}h14" stroke="#9a7048" stroke-width=".9" stroke-dasharray=".1 2.6" stroke-linecap="round"/>
    <text x="${kx+26}" y="${ky+34+7*12.6}" font-family="'Crimson Pro',Georgia,serif" font-size="7.4" fill="${HOLD_INK}">Hundred boundary</text>
    <text x="${kx+10}" y="${ky+34+8*12.6+2}" font-family="Cinzel,serif" font-weight="700" font-size="6.6" letter-spacing="1" fill="#6a5535">HUNDREDS HELD BY</text>
    ${HUND_TINTS.map((h, j) => `<rect x="${kx+8}" y="${ky+30+(9+j)*12.6-4}" width="12" height="8" rx="1.2" fill="${HOLD_PAPER}" stroke="#9a7048" stroke-width=".5"/>
      <rect x="${kx+8}" y="${ky+30+(9+j)*12.6-4}" width="12" height="8" rx="1.2" fill="${h.fill}" fill-opacity="${Math.min(1, h.op*2.2)}"/>
      <text x="${kx+26}" y="${ky+34+(9+j)*12.6}" font-family="'Crimson Pro',Georgia,serif" font-size="7.4" fill="${HOLD_INK}">${h.label}</text>`).join('')}
  </g>`;

  // compass & scale
  const mi = D.scale.px10mi;
  const furniture = `<g transform="translate(${V[0]+V[2]-34},${V[1]+V[3]-42})" pointer-events="none">
      <circle r="16" fill="${HOLD_PAPER}" fill-opacity=".6" stroke="#7a5a32" stroke-width=".7"/><circle r="12" fill="none" stroke="#7a5a32" stroke-width=".4"/>
      <path d="M0-24L3.6 0L0 24L-3.6 0Z" fill="#7a5a32"/><path d="M0-24L3.6 0H-3.6Z" fill="${HOLD_INK}"/><path d="M-20 0L0 2.6L20 0L0-2.6Z" fill="#7a5a32" fill-opacity=".7"/>
      <text y="-27" text-anchor="middle" font-family="Cinzel,serif" font-weight="700" font-size="8" fill="${HOLD_INK}">N</text></g>
    <g transform="translate(${V[0]+V[2]-34-mi-40},${V[1]+V[3]-22})" font-family="Cinzel,serif" font-size="7" fill="${HOLD_INK}" pointer-events="none">
      ${[0,1,2,3,4].map(k => `<rect x="${k*mi/5}" y="0" width="${mi/5}" height="3.2" fill="${k%2?HOLD_PAPER:HOLD_INK}" stroke="${HOLD_INK}" stroke-width=".5"/>`).join('')}
      <text x="0" y="12" text-anchor="middle">0</text><text x="${mi/2}" y="12" text-anchor="middle">5</text>
      <text x="${mi}" y="12" text-anchor="middle">10 miles</text></g>`;

  const vb = holdView || V;
  const svg = `<svg id="holdSvg" viewBox="${vb.map(v => (+v).toFixed(1)).join(' ')}" onmousedown="holdPanStart(event)"
    ondblclick="holdZoom(1.6, event)" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Map of the manors of Salisbury">
    ${defs}${paper}${hund}${terrain}${roads}${rivers}${riverNames}${roadLabels}${dike}${border}${hundLabels}${forestLabels}${plain}${neighbours}
    ${regions}${places}${manors}${key}${furniture}
    <rect x="${V[0]}" y="${V[1]}" width="${V[2]}" height="${V[3]}" fill="url(#slVig)" pointer-events="none"/>
    <rect width="${W}" height="${H}" filter="url(#slParch)" pointer-events="none"/>
  </svg>`;

  const counts = {};
  D.manors.forEach(m => { const c = holderClass(m.holder); counts[c] = (counts[c] || 0) + 1; });
  const legend = HOLD_CLASSES.filter(c => counts[c.id]).map(c => `<button class="hold-chip${holdFocus===c.id?' on':''}"
      onclick="holdSetFocus('${c.id}')"><svg viewBox="-5 -5.5 10 10" width="13" height="13"><path d="M-4 3.8V-.6L0-4.4L4-.6v4.4z" fill="${c.fill}"
      stroke="${HOLD_INK}" stroke-width=".9" stroke-linejoin="round"/><path d="M-4.9-.1L0-5.1L4.9-.1" fill="none" stroke="${HOLD_INK}" stroke-width="1.1"/></svg>
      ${hEsc(c.label)} <b>${counts[c.id]}</b></button>`).join('');
  const lab = ['all','lords','none'].map(v => `<button class="hold-chip${holdLabels===v?' on':''}" onclick="holdSetLabels('${v}')">${
      {all:'All names',lords:'Knights only',none:'No names'}[v]}</button>`).join('');

  return `<div id="holdMapBlock" class="hold-wrap">
    <div class="hold-bar">${legend}<span class="hold-sep"></span>${lab}</div>
    <div class="hold-map">${svg}<div class="hold-zoom"><button onclick="holdZoom(1.4)" title="Zoom in">+</button>
      <button onclick="holdZoom(1/1.4)" title="Zoom out">−</button><button onclick="holdZoom(0)" title="Whole county">⤢</button></div>
      <div id="holdTip" class="hold-tip"></div></div>
    <div class="hold-note">${D.manors.length} manors in ${D.hundreds.length} hundreds. Hover a manor for its holder, or open ground
      for its hundred; click a holder above to pick out their lands.</div>
  </div>`;
}

function holdLabelPos(m, r){
  const p = m.lp || 'r', fs = m.fs || 6.4, up = fs * 0.36;
  if (m.ldy) m = Object.assign({}, m, { y: m.y + m.ldy });
  if (p === 'l')  return `x="${m.x - r - 1.5}" y="${m.y + up}" text-anchor="end"`;
  if (p === 't')  return `x="${m.x}" y="${m.y - r - 1.6}" text-anchor="middle"`;
  if (p === 'b')  return `x="${m.x}" y="${m.y + r + fs}" text-anchor="middle"`;
  if (p === 'tr') return `x="${m.x + 1}" y="${m.y - r - .9}"`;
  if (p === 'br') return `x="${m.x + 1}" y="${m.y + r + fs - .2}"`;
  if (p === 'tl') return `x="${m.x - 1}" y="${m.y - r - .9}" text-anchor="end"`;
  if (p === 'bl') return `x="${m.x - 1}" y="${m.y + r + fs - .2}" text-anchor="end"`;
  return `x="${m.x + r + 1.5}" y="${m.y + up}"`;
}
function refreshHoldMap(){
  const el = document.getElementById('holdMapBlock');

}
function holdSetFocus(id){ holdFocus = holdFocus === id ? null : id; refreshHoldMap(); }
function holdSetLabels(v){ holdLabels = v; refreshHoldMap(); }

function holdHover(ev, kind, i){
  const tip = document.getElementById('holdTip'); if (!tip) return;
  if (!ev){ tip.style.display = 'none'; return; }
  const D = SALISBURY_MAP;
  let html = '';
  if (kind === 'm'){
    const m = D.manors[i], c = HOLD_BY_ID[holderClass(m.holder)];
    const hd = D.hundreds.find(h => h.name === m.h);
    html = `<b>${hEsc(m.n)}</b>
      <div class="st" style="color:${c.id==='church'?'#6b5a3a':c.fill}">${hEsc(m.holder)}</div>
      <div class="row"><span>Held of</span>${hEsc(m.of)}</div>
      <div class="row"><span>Tenure</span>${hEsc(m.ten)}</div>
      ${m.k ? `<div class="row"><span>Knight</span>${hEsc(m.k)}</div>` : ''}
      <div class="row"><span>Hundred</span>${hEsc(m.h)}${hd && hd.lord ? ` — ${hEsc(hd.lord)}` : ''}</div>
      ${m.note ? `<div class="nt">${hEsc(m.note)}</div>` : ''}`;
  } else if (kind === 'p'){
    const p = D.places[i];
    html = `<b>${hEsc(p.n)}</b>${p.alt ? ` <i style="color:#8a7350">(${hEsc(p.alt)})</i>` : ''}
      <div class="st">${hEsc(p.kind)}${p.holder ? ' · ' + hEsc(p.holder) : ''}</div>${p.note ? `<div class="nt">${hEsc(p.note)}</div>` : ''}`;
  } else {
    const h = D.hundreds[i], n = D.manors.filter(m => m.h === h.name).length;
    html = `<b>Hundred of ${hEsc(h.name)}</b><div class="st">${hEsc(h.lord || 'Unrecorded')}</div>
      ${h.how ? `<div class="nt">${hEsc(h.how)}</div>` : ''}<div class="row"><span>Manors</span>${n} on this map${h.val ? ` · £${h.val}` : ''}</div>`;
  }
  tip.innerHTML = html;
  const box = tip.parentElement.getBoundingClientRect();
  let x = ev.clientX - box.left + 14, y = ev.clientY - box.top + 14;
  tip.style.display = 'block';
  if (x + tip.offsetWidth > box.width - 4) x = ev.clientX - box.left - tip.offsetWidth - 12;
  if (y + tip.offsetHeight > box.height - 4) y = ev.clientY - box.top - tip.offsetHeight - 12;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
// Clicking a player knight's manor opens that knight's estate map.
function holdClick(i){

// ── zoom & pan ──
function holdZoom(f, ev){
  const base = SALISBURY_MAP.view;
  if (!f){ holdView = null; return holdApplyView(); }
  const v = (holdView || base).slice();
  let cx = v[0] + v[2]/2, cy = v[1] + v[3]/2;
  if (ev){ const r = document.getElementById('holdSvg').getBoundingClientRect();
    cx = v[0] + (ev.clientX - r.left) / r.width * v[2]; cy = v[1] + (ev.clientY - r.top) / r.height * v[3]; }
  const w = Math.min(base[2], Math.max(base[2]/6, v[2] / f)), h = w * base[3] / base[2];
  holdView = holdClampView([cx - w/2, cy - h/2, w, h]);
  holdApplyView();
}
function holdClampView(v){
  const b = SALISBURY_MAP.view;
  v[0] = Math.max(b[0], Math.min(v[0], b[0] + b[2] - v[2]));
  v[1] = Math.max(b[1], Math.min(v[1], b[1] + b[3] - v[3]));
  return v;
}
function holdApplyView(){
  const svg = document.getElementById('holdSvg'); if (!svg) return;
  svg.setAttribute('viewBox', (holdView || SALISBURY_MAP.view).map(v => (+v).toFixed(1)).join(' '));
  svg.style.cursor = holdView ? 'grab' : '';
}
function holdPanStart(ev){
  if (!holdView || ev.button !== 0) return;
  const svg = document.getElementById('holdSvg'), r = svg.getBoundingClientRect();
  const sx = ev.clientX, sy = ev.clientY, v0 = holdView.slice(), k = v0[2] / r.width;
  svg.style.cursor = 'grabbing';
  const move = e => { holdView = holdClampView([v0[0] - (e.clientX - sx) * k, v0[1] - (e.clientY - sy) * k, v0[2], v0[3]]); holdApplyView(); };
  const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); svg.style.cursor = 'grab'; };
  window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  ev.preventDefault();
}

function setEstateView(v){
  estateSubTab = v;
  renderEstatesTopLevel();
  if (v === 'bookkeeping') {
    const top = document.getElementById('estateTop');
    if (top && top.getBoundingClientRect().top < 0) top.scrollIntoView({block:'start'});
  }
}

// ── Estate chart: income & costs (top) and net result (bottom), one x-axis ──
const BK_INC = '#2a6fb0', BK_OUT = '#b85c1a', BK_POS = '#3d7a45', BK_NEG = '#9a3a2a';
function bkChart(ys){
  if (!ys.length) return '';
  const W = 720, L = 44, R = 16, T = 26, H1 = 120, GAP = 34, H2 = 104, B = 40;
  const H = T + H1 + GAP + H2 + B;
  const n = ys.length, band = (W-L-R)/n, cx = i => L + band*i + band/2;
  // top panel scale
  const topMax = Math.max(1, ...ys.map(y=>Math.max(y.recorded?y.income:0, y.costs)));
  const step1 = topMax > 24 ? 10 : 5, max1 = Math.ceil(topMax/step1)*step1;
  const y1 = v => T + H1 - (v/max1)*H1;
  // bottom panel scale (symmetric-ish around 0)
  const nMax = Math.max(1, ...ys.map(y=>y.final)), nMin = Math.min(0, ...ys.map(y=>y.final));
  const step2 = Math.max(nMax, -nMin) > 10 ? 5 : 2;
  const hi = Math.max(step2, Math.ceil(nMax/step2)*step2), lo = Math.min(0, Math.floor(nMin/step2)*step2);
  const top2 = T + H1 + GAP;
  const y2 = v => top2 + (hi - v)/(hi - lo)*H2;

  const grid = [];
  for (let v=0; v<=max1; v+=step1) grid.push(`<line x1="${L}" x2="${W-R}" y1="${y1(v)}" y2="${y1(v)}" class="g"/><text x="${L-6}" y="${y1(v)}" class="ax" text-anchor="end" dominant-baseline="middle">${v}£</text>`);
  for (let v=lo; v<=hi; v+=step2) grid.push(`<line x1="${L}" x2="${W-R}" y1="${y2(v)}" y2="${y2(v)}" class="${v===0?'z':'g'}"/><text x="${L-6}" y="${y2(v)}" class="ax" text-anchor="end" dominant-baseline="middle">${v>0?'+':''}${v}</text>`);

  // lines with gaps where income was not recorded
  const path = (key, ok) => { let d='', pen=false; ys.forEach((y,i)=>{ if(!ok(y)){pen=false;return;} d += (pen?'L':'M') + cx(i).toFixed(1) + ',' + y1(y[key]).toFixed(1) + ' '; pen=true; }); return d; };
  const dots = (key, col, ok) => ys.map((y,i)=> ok(y) ? `<circle cx="${cx(i)}" cy="${y1(y[key])}" r="4" fill="${col}" stroke="#f5ead6" stroke-width="2"/>` : '').join('');
  const okInc = y => y.recorded, okOut = () => true;
  const li = ys.length-1;
  const lastInc = [...ys].reverse().find(okInc);

  const bw = Math.min(30, band*0.56);
  const bars = ys.map((y,i)=>{
    const v = y.final, yy = y2(Math.max(v,0)), h = Math.max(2, Math.abs(y2(v)-y2(0)));
    const col = v>=0 ? BK_POS : BK_NEG;
    const r = Math.min(4, h/2);
    // rounded only at the data end
    const x = cx(i)-bw/2;
    const d = v>=0
      ? `M${x},${y2(0)} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${y2(0)} Z`
      : `M${x},${y2(0)} V${y2(0)+h-r} Q${x},${y2(0)+h} ${x+r},${y2(0)+h} H${x+bw-r} Q${x+bw},${y2(0)+h} ${x+bw},${y2(0)+h-r} V${y2(0)} Z`;
    const lab = v>=0 ? `<text x="${cx(i)}" y="${yy-5}" class="bl" text-anchor="middle">${fmtL(v)}</text>`
                     : `<text x="${cx(i)}" y="${y2(0)+h+11}" class="bl" text-anchor="middle">${fmtL(v)}</text>`;
    return `<path d="${d}" fill="${col}"/>${lab}`;
  }).join('');

  const years = ys.map((y,i)=>`<text x="${cx(i)}" y="${H-8}" class="yr" text-anchor="middle">${y.year}</text>`).join('');
  const hits = ys.map((y,i)=>`<rect class="hit" x="${L+band*i}" y="${T-8}" width="${band}" height="${H-T-B+8}" onmouseenter="bkTip(event,${i})" onmousemove="bkTip(event,${i})" onmouseleave="bkTip(null)"/>`).join('');
  window._bkYears = ys;

  return `<div class="bk-chart" id="bkChart">
    <div class="bk-legend">
      <span><i style="background:${BK_INC}"></i>Income</span>
      <span><i style="background:${BK_OUT};height:0;border-top:2px dashed ${BK_OUT}"></i>Costs</span>
      <span><i class="sq" style="background:${BK_POS}"></i>Surplus</span>
      <span><i class="sq" style="background:${BK_NEG}"></i>Deficit</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Income, costs and net result per year">
      <text x="${L}" y="${T-12}" class="pt">Income &amp; costs</text>
      <text x="${L}" y="${top2-12}" class="pt">Net result</text>
      ${grid.join('')}
      <path d="${path('income',okInc)}" fill="none" stroke="${BK_INC}" stroke-width="2" stroke-linejoin="round"/>
      <path d="${path('costs',okOut)}" fill="none" stroke="${BK_OUT}" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>
      ${dots('income',BK_INC,okInc)}${dots('costs',BK_OUT,okOut)}
      ${lastInc ? `<text x="${cx(ys.indexOf(lastInc))+8}" y="${y1(lastInc.income)-8}" class="dl" fill="#2a1c08">${lastInc.income}£ in</text>` : ''}
      <text x="${cx(li)+8}" y="${y1(ys[li].costs)+14}" class="dl" fill="#2a1c08">${ys[li].costs}£ out</text>
      ${bars}${years}
      <line id="bkCross" x1="0" x2="0" y1="${T-6}" y2="${H-B}" class="cross" style="display:none"/>
      ${hits}
    </svg>
    <div class="bk-tip" id="bkTip"></div>
  </div>`;
}
function bkTip(e, i){
  const tip = document.getElementById('bkTip'), cross = document.getElementById('bkCross');
  if (!tip) return;
  if (!e){ tip.style.display='none'; if(cross) cross.style.display='none'; return; }
  const y = (window._bkYears||[])[i]; if (!y) return;
  const box = document.getElementById('bkChart').getBoundingClientRect();
  const r = e.currentTarget.getBBox ? e.currentTarget : null;
  if (cross && r){ const cx = +r.getAttribute('x') + +r.getAttribute('width')/2; cross.setAttribute('x1',cx); cross.setAttribute('x2',cx); cross.style.display=''; }
  tip.innerHTML = `<b>${y.year}</b>${y.harvest ? ` <span class="h">· ${y.harvest} harvest</span>` : ''}
    <div class="r"><span>Income</span><span>${y.recorded ? y.income+'£' : '<i>not recorded</i>'}</span></div>
    <div class="r"><span>Costs</span><span>${y.costs}£</span></div>
    <div class="r t"><span>Net</span><span class="${y.final>=0?'pos':'neg'}">${fmtL(y.final)}</span></div>`;
  tip.style.display = 'block';
  let x = e.clientX - box.left + 14, yy = e.clientY - box.top + 14;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if (x + tw > box.width - 4) x = e.clientX - box.left - tw - 14;
  if (yy + th > box.height - 4) yy = e.clientY - box.top - th - 14;
  tip.style.left = x + 'px'; tip.style.top = yy + 'px';
}

function renderEstatesPanel(charName) {
  const data = MANOR_DATA[charName];
  if (!data) return '<div style="padding:2rem;color:#3d2a0e;font-style:italic">No estate data for this family.</div>';

  const homeManor = estateHome(charName);
  const ys = estateYears(charName);
  const others = data.manors.filter((m,i) => classifyManor(m,i) !== 'home');
  const improvCount = data.manors.flatMap(m => m.improvements||[]).length;

  // ── headline tiles ──
  let tiles = '';
  if (ys.length) {
    const last = ys[ys.length-1], prev = ys[ys.length-2];
    const diff = prev ? last.final - prev.final : null;
    const diffTxt = diff === null ? 'first recorded year'
      : diff === 0 ? `same as ${prev.year}`
      : `${Math.abs(diff)}£ ${diff>0?'more':'less'} than ${prev.year}`;
    const total = ys.reduce((s,y)=>s+y.final,0);
    const best = ys.reduce((a,b)=> b.final>a.final?b:a), worst = ys.reduce((a,b)=> b.final<a.final?b:a);
    tiles = `<div class="bk-tiles">
      <div class="bk-tile"><div class="k">${last.year} result</div><div class="v ${last.final>=0?'pos':'neg'}">${fmtL(last.final)}</div><div class="s">${diffTxt}</div></div>
      <div class="bk-tile"><div class="k">Total ${ys[0].year}–${last.year}</div><div class="v ${total>=0?'pos':'neg'}">${fmtL(total)}</div><div class="s">${ys.length} years recorded</div></div>
      <div class="bk-tile"><div class="k">Best · worst year</div><div class="v sm"><span class="pos">${best.year} ${fmtL(best.final)}</span> · <span class="neg">${worst.year} ${fmtL(worst.final)}</span></div><div class="s">home manor net</div></div>
      <div class="bk-tile"><div class="k">Lands</div><div class="v">${data.manors.length} <small>manor${data.manors.length===1?'':'s'}</small></div><div class="s">${improvCount} improvement${improvCount===1?'':'s'}</div></div>
    </div>`;
  }

  // ── lands list ──
  const land = (m, cls) => {
    const lab = cls==='home' ? 'Home manor' : cls==='demesne' ? 'Demesne' : 'Enfeoffed';
    const sub = cls==='home' ? 'Held directly'
      : cls==='demesne' ? (m.knight ? `Steward: ${m.knight}` : 'Held directly') + ' · income: harvest roll − 8£'
      : (m.knight ? (/^vacant/i.test(m.knight) ? m.knight.replace(/^vacant\s*/i,'Vacant ') : `Held by ${m.knight}`) : 'No holder') + ' · owes military service';
    const note = m.notes && cls!=='home' && !/^Income:/i.test(m.notes) ? `<div class="n">${m.notes}</div>` : '';
    return `<div class="bk-land ${cls}">
      <div class="h"><span class="nm">${m.name}</span><span class="tag">${lab}</span></div>
      <div class="sub">${sub}</div>${note}</div>`;
  };
  const lands = `<section class="bk-card bk-lands">
    <h3>Lands of ${charName}</h3>
    ${homeManor ? land(homeManor,'home') : ''}
    ${others.map(m => land(m, classifyManor(m, data.manors.indexOf(m)))).join('')}
  </section>`;

  const chart = ys.length ? `<section class="bk-card">
    <h3>Estate summary${homeManor ? ' · ' + homeManor.name : ''}</h3>
    ${bkChart(ys)}
  </section>` : '';

  // ── home manor ledger ──
  let ledger = '';
  if (homeManor) {
    const m = homeManor;
    const hc = r => /great|good/i.test(r) ? 'pos' : /bad|poor|terrible/i.test(r) ? 'neg' : '';
    const rows = ys.map(y => `<tr>
        <td class="yr">${y.year}</td>
        <td class="${hc(y.harvest)}">${y.harvest||'—'}</td>
        <td class="num">${y.recorded ? y.income+'£' : '<span class="na" title="Not recorded on the sheet; the net figure is authoritative">—</span>'}</td>
        <td class="num" title="Lifestyle, improvement upkeep, family, building and misc.">${y.costs}£</td>
        <td class="num net ${y.final>=0?'pos':'neg'}">${fmtL(y.final)}</td>
        <td class="nt">${y.notes}</td>
      </tr>`).join('');
    const bonusIcon = (()=>{ if(!m.bonus) return ''; for(const [k,v] of Object.entries(BONUS_ICONS)) if(m.bonus.includes(k)) return v; return '✦'; })();
    const imps = (m.improvements||[]);
    const feats = (m.bonus ? `<div class="bk-imp feat"><span class="ic">${bonusIcon}</span><div><div class="nm">${m.bonus}</div><div class="d">Manor feature</div></div></div>` : '')
      + imps.map(imp => {
          const inv = INVESTMENT_DATA[imp] || {};
          const tip = inv.notes ? ` title="${String(inv.notes).replace(/"/g,'&quot;')}"` : '';
          return `<div class="bk-imp"${tip}><span class="ic">${IMPROV_ICONS[imp] || '⚙'}</span><div>
            <div class="nm">${imp}</div>
            <div class="d"><span class="pos">↑ ${inv.income||'—'}£</span> <span class="neg">↓ ${inv.maint||'—'}£</span></div></div></div>`;
        }).join('');
    ledger = `<section class="bk-card">
      <h3>The books of ${m.name} <span class="h3s">home manor · demesne</span></h3>
      ${m.people ? `<div class="bk-people">
        <span><b>Population</b> ${m.people.pop} lots</span>
        <span><b>Garrison</b> ${m.people.garrison ?? '—'}</span>
        <span><b>Levy</b> ${m.people.levy ?? '<i>not yet recorded</i>'}</span>
        ${m.people.dv != null ? `<span><b>Defence</b> DV ${m.people.dv}</span>` : ''}
      </div>` : ''}
      ${ys.length ? `<div class="bk-table-wrap"><table class="bk-table">
        <thead><tr><th>Year</th><th>Harvest</th><th class="num">Income</th><th class="num">Costs</th><th class="num">Net</th><th>Notes</th></tr></thead>
        <tbody>${rows}</tbody></table></div>` : `<p class="bk-empty">No yearly records yet.</p>`}
      ${feats ? `<h4>Improvements &amp; features</h4><div class="bk-imps">${feats}</div>` : ''}
    </section>`;
  }

  return `${tiles}
    <div class="bk-top">${chart}${lands}</div>
    ${ledger}`;
}


document.getElementById('modalOverlay').onclick=e=>{if(e.target===document.getElementById('modalOverlay'))closeModal();};
document.getElementById('gmSection').style.display='flex';
document.getElementById('gmSection').style.flexDirection='column';
document.addEventListener('DOMContentLoaded', () => {
  setMode(mode);   // opens on the Kingdoms map and squares up the layout
});
function setTheme(t){
  document.body.classList.remove('theme-verdant','theme-crimson');
  if(t) document.body.classList.add('theme-'+t);
  localStorage.setItem('pendragon-theme', t);
  ['parchment','verdant','crimson'].forEach(n => {
    const b = document.getElementById('thm-'+n);
    if(b) b.style.outline = (t===n||(t===''&&n==='parchment')) ? '2px solid white' : 'none';
  });
}
// Restore on load
(function(){ const t=localStorage.getItem('pendragon-theme')||''; setTheme(t); })();
// GM Tome shows only when the page is opened with ?gm (remembered in this browser).
// ?gm=off hides it again.
function gmEnabled(){ return document.body.classList.contains('gm-enabled'); }
(function(){
  let on = false;
  try {
    const q = new URLSearchParams(location.search);
    if (q.has('gm')) {
      on = !/^(off|0|no|false)$/i.test(q.get('gm') || '');
      localStorage.setItem('pendragon-gm', on ? '1' : '0');
    } else {
      on = localStorage.getItem('pendragon-gm') === '1';
    }
  } catch(e){}
  document.body.classList.toggle('gm-enabled', on);
})();

</script>
