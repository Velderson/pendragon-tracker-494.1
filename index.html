// ── small geometry kit ────────────────────────────────────────────────────
const MM = {
  rng(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
    let a = h>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; },
  dir(b){ const t=b*Math.PI/180; return [Math.sin(t), -Math.cos(t)]; },
  bearing(a,b){ return (Math.atan2(b[0]-a[0], -(b[1]-a[1]))*180/Math.PI + 360) % 360; },
  angDiff(a,b){ return Math.abs(((a-b)%360+540)%360-180); },
  dist(a,b){ return Math.hypot(a[0]-b[0], a[1]-b[1]); },
  f(n){ return Math.round(n*10)/10; },
  d(pts, close){ return 'M' + pts.map(p => MM.f(p[0])+' '+MM.f(p[1])).join('L') + (close?'Z':''); },
  circ(x,y,r){ return `M${MM.f(x-r)} ${MM.f(y)}a${MM.f(r)} ${MM.f(r)} 0 1 0 ${MM.f(2*r)} 0a${MM.f(r)} ${MM.f(r)} 0 1 0 ${MM.f(-2*r)} 0`; },
  ell(x,y,rx,ry){ return `M${MM.f(x-rx)} ${MM.f(y)}a${MM.f(rx)} ${MM.f(ry)} 0 1 0 ${MM.f(2*rx)} 0a${MM.f(rx)} ${MM.f(ry)} 0 1 0 ${MM.f(-2*rx)} 0`; },
  // Catmull-Rom through control points, sampled every ~step px
  cr(ctrl, step){
    const out = [];
    for (let i=0;i<ctrl.length-1;i++){
      const p0=ctrl[i-1]||ctrl[i], p1=ctrl[i], p2=ctrl[i+1], p3=ctrl[i+2]||ctrl[i+1];
      const n = Math.max(2, Math.ceil(MM.dist(p1,p2)/step));
      for (let k=0;k<n;k++){ const t=k/n, t2=t*t, t3=t2*t;
        out.push([0,1].map(j => 0.5*((2*p1[j]) + (-p0[j]+p2[j])*t + (2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2 + (-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3))); }
    }
    out.push(ctrl[ctrl.length-1].slice()); return out;
  },
  resample(pts, step){
    const out=[pts[0].slice()]; let carry=0;
    for (let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i], L=MM.dist(a,b); let s=step-carry;
      while (s<=L){ out.push([a[0]+(b[0]-a[0])*s/L, a[1]+(b[1]-a[1])*s/L]); s+=step; } carry=(carry+L)%step; }
    const last=pts[pts.length-1]; if (MM.dist(out[out.length-1],last)>step*0.3) out.push(last.slice()); return out;
  },
  normals(pts){ return pts.map((p,i) => { const a=pts[Math.max(0,i-1)], b=pts[Math.min(pts.length-1,i+1)]; const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1; return [-dy/L, dx/L]; }); },
  offset(pts, d){ const n=MM.normals(pts); return pts.map((p,i) => [p[0]+n[i][0]*d, p[1]+n[i][1]*d]); },
  // sideways noise along a line, pinned at both ends
  wobble(pts, amp, rnd, lam){
    lam = lam || 90; const ph=[rnd()*6.28, rnd()*6.28, rnd()*6.28], l1=lam*(0.8+rnd()*0.5), l2=lam*(0.35+rnd()*0.2), l3=lam*2.3;
    const n=MM.normals(pts); let s=0; const len=[0]; for (let i=1;i<pts.length;i++){ s+=MM.dist(pts[i-1],pts[i]); len.push(s); }
    const L=s||1, fade=Math.min(60, L/3);
    return pts.map((p,i) => { const u=len[i], tp=Math.min(1, u/fade, (L-u)/fade);
      const o = amp*tp*(Math.sin(u/l1+ph[0]) + 0.45*Math.sin(u/l2+ph[1]) + 0.6*Math.sin(u/l3+ph[2]))/1.6;
      return [p[0]+n[i][0]*o, p[1]+n[i][1]*o]; });
  },
  line(a, b, amp, rnd, step, lam){ const L=MM.dist(a,b), n=Math.max(2,Math.ceil(L/(step||8))); const pts=[]; for (let i=0;i<=n;i++) pts.push([a[0]+(b[0]-a[0])*i/n, a[1]+(b[1]-a[1])*i/n]); return amp ? MM.wobble(pts, amp, rnd, lam||Math.max(30,L/3)) : pts; },
  inPoly(p, poly){ let c=false; for (let i=0,j=poly.length-1;i<poly.length;j=i++){ const a=poly[i], b=poly[j];
      if (((a[1]>p[1])!==(b[1]>p[1])) && (p[0] < (b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])) c=!c; } return c; },
  near(p, pts){ let m=1e9; for (let i=0;i<pts.length;i++){ const dx=pts[i][0]-p[0], dy=pts[i][1]-p[1], q=dx*dx+dy*dy; if (q<m) m=q; } return Math.sqrt(m); },
  nearIdx(p, pts){ let m=1e9, k=0; for (let i=0;i<pts.length;i++){ const dx=pts[i][0]-p[0], dy=pts[i][1]-p[1], q=dx*dx+dy*dy; if (q<m){ m=q; k=i; } } return k; },
  segX(a,b,c,d){ const r=[b[0]-a[0],b[1]-a[1]], s=[d[0]-c[0],d[1]-c[1]], den=r[0]*s[1]-r[1]*s[0]; if (Math.abs(den)<1e-9) return null;
    const t=((c[0]-a[0])*s[1]-(c[1]-a[1])*s[0])/den, u=((c[0]-a[0])*r[1]-(c[1]-a[1])*r[0])/den; return (t>=0&&t<=1&&u>=0&&u<=1) ? [a[0]+t*r[0], a[1]+t*r[1]] : null; },
  centroid(pts){ let x=0,y=0; pts.forEach(p=>{x+=p[0];y+=p[1];}); return [x/pts.length, y/pts.length]; },
  roman(n){ return ['','i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii'][n] || String(n); },
};

// ── RENDER MANOR MAP SVG ──────────────────────────────────────────────────
function renderManorMapSVG(charName) {
  const cfg = MANOR_MAP_CONFIG[charName];
  if (!cfg) return '<div style="padding:2rem;font-style:italic;color:#3d2a0e">No map config for this manor.</div>';
  const md = MANOR_DATA[charName];
  const t = MANOR_TONES[cfg.tone] || MANOR_TONES.warm;
  const WT = MANOR_WATER;
  const W = 960, H = 820, svgId = 'msv_' + charName;
  const R = MM.rng('manor:' + charName + ':' + cfg.manorName);
  const rnd = () => R(), rr = (a,b) => a + (b-a)*R(), pick = arr => arr[Math.floor(R()*arr.length)];
  const sc = p => [p[0]*W, p[1]*H];
  const vc = sc(cfg.village);
  const inView = (p, m) => p[0]>-(m||0) && p[0]<W+(m||0) && p[1]>-(m||0) && p[1]<H+(m||0);
  const ID = s => `${svgId}-${s}`;
  const FONT_L = `font-family="'IM Fell English',serif" font-style="italic"`;
  const halo = (c) => `paint-order="stroke" stroke="${c||'#efe3c2'}" stroke-width="3.2" stroke-linejoin="round"`;

  const homeManor = md ? md.manors[0] : null;
  const improvements = homeManor ? (homeManor.improvements || []) : [];
  const has = name => improvements.includes(name);

  // ── rivers ──
  const rivers = cfg.rivers.map(rv => {
    let pts = MM.resample(MM.cr(rv.pts.map(sc), 8), 5);
    pts = MM.resample(MM.wobble(pts, 4 + rv.width*0.9, rnd, 70 + rv.width*4), 4);
    return Object.assign({}, rv, {pts});
  });
  const riverGap = p => { let m = 1e9; rivers.forEach(r => { m = Math.min(m, MM.near(p, r.pts) - r.width/2); }); return m; };

  // ── roads ──
  const roads = cfg.roads.map(rd => {
    let pts = MM.resample(MM.cr(rd.pts.map(sc), 8), 5);
    pts = MM.resample(MM.wobble(pts, rd.type==='good' ? 4 : 7, rnd, rd.type==='good' ? 140 : 70), 4);
    return Object.assign({}, rd, {pts});
  });
  const allRoadPts = roads.flatMap(r => r.pts);
  const roadGap = p => MM.near(p, allRoadPts);

  // ── field ring (village edge inside, arable edge outside), sampled every 2° ──
  const N = 180, STEP = 360/N;
  const harm = (amp) => { const c=[]; for (let k=2;k<=7;k++) c.push([k, (rnd()*2-1)/k, rnd()*6.283]); return b => { let s=0; const a=b*Math.PI/180; c.forEach(([k,w,p]) => s += w*Math.sin(k*a+p)); return s*amp; }; };
  const nIn = harm(0.34), nOut = harm(0.62);
  const hb = cfg.hallBearing;
  const bulge = 92, bulgeW = 25;
  const rInB = [], rIn = [], rOut = [];
  for (let i=0;i<N;i++){
    const b = i*STEP;
    rInB[i] = cfg.villageR * (1 + nIn(b));
    rIn[i] = rInB[i] + bulge*Math.exp(-Math.pow(MM.angDiff(b,hb)/bulgeW, 2));
    const [dx,dy] = MM.dir(b), [rx,ry] = cfg.ring;
    let r = (1/Math.sqrt(Math.pow(dx/rx,2)+Math.pow(dy/ry,2))) * (1 + nOut(b));
    while (r > rIn[i] + 80){ const p=[vc[0]+dx*r, vc[1]+dy*r];
      if (p[0]>34 && p[0]<W-34 && p[1]>64 && p[1]<H-34 && riverGap(p) > 26) break; r -= 4; }
    rOut[i] = Math.max(r, rIn[i] + 80);
  }
  for (let pass=0; pass<4; pass++){ const c=rOut.slice(); for (let i=0;i<N;i++){ const avg=(c[(i+N-2)%N]+c[(i+N-1)%N]+c[i]+c[(i+1)%N]+c[(i+2)%N])/5; rOut[i]=Math.max(rIn[i]+78, Math.min(c[i], avg)); } }
  const ptIn  = i => { const d=MM.dir(i*STEP); return [vc[0]+d[0]*rIn[i],  vc[1]+d[1]*rIn[i]]; };
  const ptOut = i => { const d=MM.dir(i*STEP); return [vc[0]+d[0]*rOut[i], vc[1]+d[1]*rOut[i]]; };
  const arc = (fn, a, b) => { const out=[]; let i=a; out.push(fn(i)); while (i!==b){ i=(i+1)%N; out.push(fn(i)); } return out; };
  const snap = b => ((Math.round(b/STEP) % N) + N) % N;
  const innerPoly = arc(ptIn, 0, N-1);
  const outerPoly = arc(ptOut, 0, N-1);
  const inVillage = p => MM.inPoly(p, innerPoly);

  // ── lots ──
  const lotCount = cfg.lotCount || 10;
  const startB = rnd()*360/lotCount;
  let bnd = []; for (let k=0;k<lotCount;k++) bnd.push(snap(startB + k*360/lotCount + rr(-0.2,0.2)*360/lotCount));
  bnd = [...new Set(bnd)].sort((a,b)=>a-b);
  const radials = bnd.map(i => MM.resample(MM.line(ptIn(i), ptOut(i), 20, rnd, 8, 70), 6));
  let lots = bnd.map((a,k) => { const b = bnd[(k+1)%bnd.length];
    const pts = [].concat(arc(ptIn,a,b), radials[(k+1)%bnd.length].slice(1), arc(ptOut,a,b).reverse().slice(1), radials[k].slice().reverse().slice(1));
    const span = ((b-a+N)%N)*STEP, mid = (a*STEP + span/2) % 360;
    return {a, b, pts, mid}; });
  // number clockwise, lot i starting in the north-west like the old map
  const first = lots.reduce((best,l,i) => MM.angDiff(l.mid,300) < MM.angDiff(lots[best].mid,300) ? i : best, 0);
  lots = lots.slice(first).concat(lots.slice(0,first));

  // ── outer zones ──
  const zcfg = cfg.zones.map(([k,b]) => ({k, i:snap(b)})).sort((x,y)=>x.i-y.i);
  const FAR = 1500;
  const zRad = zcfg.map(z => { const d=MM.dir(z.i*STEP), p0=ptOut(z.i); return MM.resample(MM.line(p0, [vc[0]+d[0]*FAR, vc[1]+d[1]*FAR], 26, rnd, 10, 120), 8); });
  const zones = zcfg.map((z,k) => { const nz = zcfg[(k+1)%zcfg.length];
    const far = []; let span = ((nz.i - z.i + N) % N) || N; for (let s=span; s>=0; s-=3){ const d=MM.dir((z.i+s)*STEP); far.push([vc[0]+d[0]*FAR, vc[1]+d[1]*FAR]); }
    const pts = [].concat(arc(ptOut, z.i, nz.i), zRad[(k+1)%zcfg.length].slice(1), far, zRad[k].slice().reverse());
    return {k:z.k, a:z.i, b:nz.i, pts, mid:(z.i*STEP + span*STEP/2)%360}; });
  const zoneOf = key => zones.find(z => z.k===key);
  const reserved = p => (p[0] < 300 && p[1] > H-180) || (p[1] < 110 && Math.abs(p[0]-W/2) < 230) || (p[0] > W-120 && p[1] > H-120);
  const inZone = (key, p) => { const z=zoneOf(key); return z && MM.inPoly(p, z.pts); };
  // a good spot well inside a zone and on the map
  const taken = [];
  function zoneSpot(key, frac, off, keep){
    const z = zoneOf(key); if (!z) return null;
    for (let tries=0; tries<40; tries++){
      const b = z.mid + (off||0) + (tries ? rr(-1,1)*Math.min(40, tries*3) : 0), d=MM.dir(b), ro=rOut[snap(b)];
      let r = ro + 30; while (inView([vc[0]+d[0]*(r+10), vc[1]+d[1]*(r+10)], -40)) r += 10;
      const p = [vc[0]+d[0]*(ro + (r-ro)*(frac==null?0.5:frac)), vc[1]+d[1]*(ro + (r-ro)*(frac==null?0.5:frac))];
      if (inView(p,-50) && MM.inPoly(p, z.pts) && riverGap(p) > 30 && roadGap(p) > 26 && !reserved(p) && taken.every(q => MM.dist(q,p) > 80)) { if (keep) taken.push(p); return p; }
    }
    for (let k=0;k<400;k++){ const p=[rr(40,W-40), rr(110,H-40)]; if (MM.inPoly(p, z.pts) && !reserved(p) && riverGap(p)>20) { if (keep) taken.push(p); return p; } }
    return null;
  }

  const siteSpot = cfg.bonusSite==='stones' ? zoneSpot('waste', 0.45, 8, true)
    : cfg.bonusSite==='plinth' ? zoneSpot('waste', 0.5, -10, true)
    : cfg.bonusSite==='hermitage' ? zoneSpot('woodland', 0.55, 25, true)
    : cfg.bonusSite==='battlefield' ? zoneSpot('waste', 0.5, 0, true) : null;

  // ── shared batches (merged into a few paths for speed) ──
  const trees = [];          // [x,y,r,variant]
  const keepClear = [];      // [x,y,r] — no trees here
  const clearOf = p => keepClear.every(([x,y,r]) => Math.hypot(p[0]-x,p[1]-y) > r);
  if (siteSpot) keepClear.push([siteSpot[0], siteSpot[1], cfg.bonusSite==='hermitage' ? 30 : 40]);

  // ── woodcutting: a felled clearing at the wood's edge with the cutters' camp ──
  let wcut = null;
  if (cfg.woodcut && zoneOf('woodland')){
    const z = zoneOf('woodland'); let best = null, bs = -1e9;
    for (let k=0;k<1500;k++){ const p=[rr(60,W-60), rr(100,H-60)]; if (!MM.inPoly(p, z.pts) || reserved(p)) continue;
      const e = MM.near(p, outerPoly); if (e < 50) continue; if (roadGap(p) < 40) continue;
      const g = riverGap(p); if (g < 72 || g > 110) continue;          // beside the water, not on it
      const sc0 = -g*2 - MM.dist(p, vc)*0.3 - Math.abs(e-90)*0.5; if (sc0 > bs){ bs = sc0; best = p; } }
    if (best){ // lay the clearing along the water
      let q = null, a0 = 0; rivers.forEach(rv => { const i = MM.nearIdx(best, rv.pts); if (!q || MM.dist(best, rv.pts[i]) < MM.dist(best, q)) { q = rv.pts[i]; const n = rv.pts[Math.min(i+3, rv.pts.length-1)], m = rv.pts[Math.max(i-3,0)]; a0 = Math.atan2(n[1]-m[1], n[0]-m[0])*180/Math.PI; } });
      wcut = {c: best, rx: 60, ry: 40, ang: a0}; taken.push(best); }
  }
  if (wcut){ keepClear.push([wcut.c[0], wcut.c[1], 52]);
    { let lp=null; rivers.forEach(rv => { const q = rv.pts[MM.nearIdx(wcut.c, rv.pts)]; if (!lp || MM.dist(wcut.c,q) < MM.dist(wcut.c,lp)) lp = q; }); for (let u=0.15; u<=1.01; u+=0.12) keepClear.push([wcut.c[0]+(lp[0]-wcut.c[0])*u, wcut.c[1]+(lp[1]-wcut.c[1])*u, 13]); } const e = MM.nearIdx(wcut.c, outerPoly), q = outerPoly[e]; for (let u=0.2; u<1; u+=0.2) keepClear.push([wcut.c[0]+(q[0]-wcut.c[0])*u, wcut.c[1]+(q[1]-wcut.c[1])*u, 22]); }

  // ── extra lots for extra people: set apart from the open field, on new-broken ground ──
  const extraLots = [];
  (cfg.extraLots || []).forEach((ex, xi) => {
    let best = null, bestScore = -1e9;
    for (let pass=0; pass<2 && !best; pass++) ex.zones.forEach(zk => { const z = zoneOf(zk); if (!z) return;
      for (let k=0; k<500; k++){
        const c = [rr(60, W-60), rr(100, H-60)];
        if (!MM.inPoly(c, z.pts)) continue;
        const b = MM.bearing(vc, c);
        const hs = ex.half ? 0.72 : 1, rx = (pass ? rr(42,50) : rr(50,60))*hs, ry = (pass ? rr(29,34) : rr(34,42))*hs, ang = b + 90 + rr(-25,25);
        const pts = []; const nz = [rnd()*6.28, rnd()*6.28];
        for (let j=0;j<44;j++){ const a=j/44*Math.PI*2, w=1+0.1*Math.sin(3*a+nz[0])+0.06*Math.sin(5*a+nz[1]);
          const x=Math.cos(a)*rx*w, y=Math.sin(a)*ry*w, t0=ang*Math.PI/180; pts.push([c[0]+x*Math.cos(t0)-y*Math.sin(t0), c[1]+x*Math.sin(t0)+y*Math.cos(t0)]); }
        if (!pts.every(p => p[0]>30 && p[0]<W-30 && p[1]>70 && p[1]<H-30 && !reserved(p) && riverGap(p) > 10)) continue;
        if (pts.filter(p => MM.inPoly(p, z.pts)).length < pts.length*(pass ? 0.8 : 1)) continue;
        if (pts.some(p => MM.inPoly(p, outerPoly))) continue;
        if (MM.near(c, outerPoly) < (pass ? 55 : 75)) continue;
        if (extraLots.some(e => MM.dist(e.c, c) < 150)) continue;
        if (siteSpot && MM.dist(siteSpot, c) < 95) continue;
        if (taken.some(q => MM.dist(q, c) < 85)) continue;
        let sc0 = -Math.abs(MM.near(c, outerPoly) - 110) - (roadGap(c) < 30 ? 80 : 0);
        if (ex.near === 'site' && siteSpot) sc0 -= Math.abs(MM.dist(siteSpot, c) - 130) * 0.8;
        if (sc0 > bestScore){ bestScore = sc0; best = {c, pts, b, ang, rx, ry}; }
      } });
    if (!best) return;
    taken.push(best.c);
    keepClear.push([best.c[0], best.c[1], Math.max(best.rx, best.ry) + 26]);
    extraLots.push(Object.assign({}, ex, best));
  });
  const treeOK = (p, r) => riverGap(p) > r*0.6+2 && roadGap(p) > r+3 && !inVillage(p) && clearOf(p);

  const defs = [];
  const labelsLate = [];
  const out = [];   // main drawing, in layer order

  // ════ PAPER ════
  defs.push(`
  <filter id="${ID('paper')}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="${Math.floor(rnd()*99)}"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 -1.6 1.15"/></filter>
  <filter id="${ID('blotch')}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="${Math.floor(rnd()*99)}"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0 0.15  0 0 0 -2.2 1.2"/></filter>
  <radialGradient id="${ID('vig')}" cx="50%" cy="50%" r="72%"><stop offset="62%" stop-color="#5a3a14" stop-opacity="0"/><stop offset="100%" stop-color="#5a3a14" stop-opacity="0.38"/></radialGradient>
  <filter id="${ID('mist')}"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="${ID('soft')}"><feGaussianBlur stdDeviation="1.4"/></filter>
  <clipPath id="${ID('frame')}"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath>`);

  // ════ ZONES (interactive groups: fill + texture) ════
  const zoneLabelPos = {};
  const tufts = [], flowers = [], sheepB = [], sheepH = [], stones = [], gorse = [], gorseF = [], hayc = [], cattle = [];
  const hills = [];
  const scatter = (z, n, fn) => { let got=0, tries=0; while (got<n && tries<n*25){ tries++; const p=[rr(-10,W+10), rr(-10,H+10)]; if (MM.inPoly(p, z.pts) && riverGap(p)>4 && roadGap(p)>5){ fn(p); got++; } } };
  const areaIn = (z) => { let c=0; for (let k=0;k<160;k++){ if (MM.inPoly([rr(0,W),rr(0,H)], z.pts)) c++; } return c/160*W*H; };

  zones.forEach(z => {
    const A = areaIn(z);
    if (z.k==='woodland'){
      const s = 12.5;
      for (let y=-10; y<H+16; y+=s*0.86){ for (let x=-10 + ((Math.round(y/(s*0.86))%2)*s/2); x<W+16; x+=s){
        const p=[x+rr(-4,4), y+rr(-4,4)]; if (!MM.inPoly(p, z.pts)) continue; const r=rr(7,11.5);
        if (treeOK(p, r*0.7)) trees.push([p[0],p[1],r, rnd()<0.5?0:(rnd()<0.6?1:2)]); } }
    }
    if (z.k==='pasture'){
      scatter(z, A/700, p => tufts.push(p));
      // flocks
      const nf = 2 + Math.floor(rnd()*3) + (has('Sheep Herd')?2:0);
      for (let f=0; f<nf; f++){ let c=null; for (let k=0;k<30&&!c;k++){ const p=[rr(20,W-20), rr(70,H-20)]; if (MM.inPoly(p,z.pts) && riverGap(p)>20 && roadGap(p)>16) c=p; }
        if (!c) continue; const n = 5 + Math.floor(rnd()*9) + (has('Sheep Herd')?6:0);
        for (let k=0;k<n;k++){ const p=[c[0]+rr(-22,22), c[1]+rr(-15,15)]; if (!MM.inPoly(p,z.pts)) continue; const a=rr(-0.6,0.6); sheepB.push([p[0],p[1],a]); } }
      // lone trees & a copse
      scatter(z, A/9000, p => { if (treeOK(p,8)) trees.push([p[0],p[1],rr(7,11),0]); });
    }
    if (z.k==='meadow'){
      scatter(z, A/260, p => flowers.push(p));
      scatter(z, A/1100, p => tufts.push(p));
      // haycocks in loose rows
      for (let row=0; row<2; row++){ const c = zoneSpot('meadow', rr(0.25,0.75), rr(-20,20)); if (!c) continue; const a=rr(0,Math.PI);
        for (let k=-3;k<=3;k++){ const p=[c[0]+Math.cos(a)*k*19+rr(-3,3), c[1]+Math.sin(a)*k*19+rr(-3,3)]; if (MM.inPoly(p,z.pts) && riverGap(p)>8) hayc.push(p); } }
      scatter(z, 4, p => { if (riverGap(p)>14) cattle.push([p[0],p[1],rr(-1,1)]); });
      scatter(z, A/14000, p => { if (treeOK(p,8)) trees.push([p[0],p[1],rr(6,9),2]); });
    }
    if (z.k==='waste'){
      if (cfg.waste==='downs'){
        for (let k=0;k<7;k++){ const c = zoneSpot('waste', rr(0.15,0.9), rr(-35,35)); if (!c) continue; const a=rr(-0.35,0.35), n=2+Math.floor(rnd()*4);
          for (let j=0;j<n;j++){ const p=[c[0]+Math.cos(a)*(j-n/2)*34+rr(-5,5), c[1]+Math.sin(a)*(j-n/2)*34+rr(-6,6)]; if (MM.inPoly(p,z.pts) && roadGap(p)>18 && !reserved(p) && (!siteSpot || MM.dist(p,siteSpot)>55)) hills.push([p[0],p[1],rr(15,24)]); } }
        scatter(z, A/1600, p => tufts.push(p));
        scatter(z, A/4500, p => gorse.push([p[0],p[1],rr(2.5,4.5)]));
      } else {
        scatter(z, A/650, p => gorse.push([p[0],p[1],rr(2.5,5.5)]));
        scatter(z, A/900, p => gorseF.push(p));
        for (let k=0;k<3;k++){ const c = zoneSpot('waste', rr(0.3,0.8), rr(-30,30)); if (c && roadGap(c)>20 && (!siteSpot || MM.dist(c,siteSpot)>60)) hills.push([c[0],c[1],rr(12,17)]); }
      }
      scatter(z, A/2600, p => stones.push([p[0],p[1],rr(1.4,2.8)]));
      scatter(z, A/12000, p => { if (treeOK(p,7)) trees.push([p[0],p[1],rr(5,8),2]); });
    }
    if (z.k==='fallow'){
      scatter(z, A/700, p => tufts.push(p));
      scatter(z, A/2600, p => gorse.push([p[0],p[1],rr(1.8,3)]));
    }
  });

  // pattern defs for zone textures
  defs.push(`
  <pattern id="${ID('pfal')}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(${Math.round(rr(0,180))})"><path d="M0 4.5H9" stroke="#7a5a20" stroke-width="0.7" opacity="0.22"/><circle cx="3" cy="2" r="0.7" fill="#6a7a30" opacity="0.45"/></pattern>
  <pattern id="${ID('pgrass')}" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r="0.8" fill="#3d6a1c" opacity="0.32"/><circle cx="8" cy="8" r="0.7" fill="#3d6a1c" opacity="0.28"/></pattern>
  <pattern id="${ID('pwet')}" width="14" height="8" patternUnits="userSpaceOnUse"><path d="M1 6q2 -3 4 0M8 3q2 -3 4 0" stroke="#2f6a2a" stroke-width="0.6" fill="none" opacity="0.35"/></pattern>
  <pattern id="${ID('pwood')}" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="3.5" fill="#1f3d10" opacity="0.25"/></pattern>
  <pattern id="${ID('pheath')}" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#7a4a6a" opacity="0.35"/><circle cx="6" cy="5" r="0.7" fill="#5a5a28" opacity="0.4"/></pattern>
  <pattern id="${ID('pchalk')}" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="1.1" fill="#fbf6e6" opacity="0.5"/><circle cx="12" cy="12" r="0.8" fill="#8a8458" opacity="0.35"/></pattern>`);

  function fallowStrips(parts){
    return parts.map(z => { const c=[vc[0]+MM.dir(z.mid)[0]*(rOut[snap(z.mid)]+200), vc[1]+MM.dir(z.mid)[1]*(rOut[snap(z.mid)]+200)], R0=420, ang=z.mid+rr(-20,20);
      let x=-R0, r=[]; while (x<R0){ const w=rr(8,15); r.push(`<rect x="${MM.f(c[0]+x)}" y="${MM.f(c[1]-R0)}" width="${MM.f(w+0.5)}" height="${R0*2}" fill="${rnd()<0.5?'#c2a670':'#cdb886'}" opacity="0.55"/>`); x+=w; }
      return `<g transform="rotate(${MM.f(ang)} ${MM.f(c[0])} ${MM.f(c[1])})">${r.join('')}</g>`; }).join('');
  }
  const zoneFill = { fallow:t.fallow, pasture:t.pasture, meadow:t.meadow, woodland:t.woodland, waste:t.waste };
  const zoneTex  = { fallow:'pfal', pasture:'pgrass', meadow:'pwet', woodland:'pwood', waste: cfg.waste==='downs' ? 'pchalk' : 'pheath' };
  const zoneLabel = { fallow:'Fallow', pasture:'Common Pasture', meadow:'The Meadow', woodland:"Lord's Wood", waste: cfg.waste==='downs' ? 'The Downs' : 'Heath & Waste' };
  const zt = cfg.zoneText || {};
  const zKeys = [...new Set(zones.map(z=>z.k))]; const labelKeys = [];
  zKeys.forEach(k => {
    const parts = zones.filter(z=>z.k===k);
    const dd = parts.map(z => MM.d(z.pts,true)).join('');
    defs.push(`<clipPath id="${ID('cz-'+k)}"><path d="${dd}"/></clipPath>`);
    out.push(`<g id="${ID(k)}" class="mz" data-char="${charName}" data-key="${k}" style="cursor:pointer">
  <path class="zo" d="${dd}" fill="${zoneFill[k]}" stroke="none"/>
  <g clip-path="url(#${ID('cz-'+k)})">${k==='fallow' ? fallowStrips(parts) : ''}<path d="${dd}" fill="url(#${ID(zoneTex[k])})"/><path d="${dd}" fill="none" stroke="#2a1a06" stroke-width="10" opacity="0.07"/></g>
</g>`);
    labelKeys.push(k);
  });

  // ════ LOTS (strip fields) ════
  lots.forEach((L, k) => {
    const key = 'lot' + (k+1), c = MM.centroid(L.pts);
    const maxR = Math.max(...L.pts.map(p => MM.dist(p,c))) + 10;
    const ang = (L.mid + (rnd()<0.35 ? 90 : 0) + rr(-14,14)) % 180;
    const dd = MM.d(L.pts, true);
    defs.push(`<clipPath id="${ID('cl'+k)}"><path d="${dd}"/></clipPath>
  <pattern id="${ID('fur'+k)}" width="3.2" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(${MM.f(ang)})"><path d="M0.3 0V40" stroke="#5a3e10" stroke-width="0.45" opacity="0.28"/></pattern>`);
    // strips in a rotated frame; crops vary strip by strip
    let x = -maxR, rects = []; const base = pick(t.strips);
    while (x < maxR){ const w = rr(7,14); const col = rnd()<0.55 ? base : pick(t.strips);
      rects.push(`<rect x="${MM.f(c[0]+x)}" y="${MM.f(c[1]-maxR)}" width="${MM.f(w+0.6)}" height="${MM.f(maxR*2)}" fill="${col}"/>`);
      if (rnd()<0.5) rects.push(`<rect x="${MM.f(c[0]+x+w-0.6)}" y="${MM.f(c[1]-maxR)}" width="1" height="${MM.f(maxR*2)}" fill="#6a5020" opacity="0.25"/>`);
      x += w; }
    // a furlong split: second half of some lots runs the other way
    let split = '';
    if (rnd() < 0.65){
      const a2 = ang + 90, c2 = [c[0] + MM.dir(L.mid)[0]*maxR*0.35, c[1] + MM.dir(L.mid)[1]*maxR*0.35];
      let x2 = -maxR*0.55, r2 = []; const b2 = pick(t.strips);
      while (x2 < maxR*0.55){ const w=rr(6,11); r2.push(`<rect x="${MM.f(c2[0]+x2)}" y="${MM.f(c2[1]-maxR*0.45)}" width="${MM.f(w+0.6)}" height="${MM.f(maxR*0.9)}" fill="${rnd()<0.6?b2:pick(t.strips)}"/>`); x2+=w; }
      split = `<g transform="rotate(${MM.f(a2)} ${MM.f(c2[0])} ${MM.f(c2[1])})">${r2.join('')}<rect x="${MM.f(c2[0]-maxR*0.55)}" y="${MM.f(c2[1]-maxR*0.45)}" width="${MM.f(maxR*1.1)}" height="${MM.f(maxR*0.9)}" fill="none" stroke="#8a7a40" stroke-width="2.4" opacity="0.5"/></g>`;
    }
    const cmp = ['North','North-East','East','South-East','South','South-West','West','North-West'][Math.round(L.mid/45)%8];
    out.push(`<g id="${ID(key)}" class="mz lot" data-char="${charName}" data-key="${key}" data-zname="Lot ${k+1} — ${cmp} Field" style="cursor:pointer">
  <path class="zo" d="${dd}" fill="${base}" stroke="none"/>
  <g clip-path="url(#${ID('cl'+k)})">
    <g transform="rotate(${MM.f(ang)} ${MM.f(c[0])} ${MM.f(c[1])})">${rects.join('')}</g>${split}
    <path d="${dd}" fill="url(#${ID('fur'+k)})"/>
    <path d="${dd}" fill="none" stroke="#3a2a08" stroke-width="9" opacity="0.08"/>
  </g>
</g>`);
    L.key = key; L.c = c;
  });

  extraLots.forEach((E, j) => {
    const k = lots.length + j, key = 'lot' + (k+1), c = E.c, dd = MM.d(E.pts, true), maxR = Math.max(E.rx, E.ry) + 12;
    const ang = (E.b + rr(-15,15)) % 180;
    defs.push(`<clipPath id="${ID('cx'+j)}"><path d="${dd}"/></clipPath>
  <pattern id="${ID('furx'+j)}" width="3.2" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(${MM.f(ang)})"><path d="M0.3 0V40" stroke="#5a3e10" stroke-width="0.45" opacity="0.3"/></pattern>`);
    const pal = E.kind === 'pilgrims' ? ['#d8c27a','#cbb36a','#bfae6a','#d2c48a'] : ['#c9ad62','#bea258','#b39c5c','#cbb676'];
    let x = -maxR, rects = []; while (x < maxR){ const w = rr(6,10); rects.push(`<rect x="${MM.f(c[0]+x)}" y="${MM.f(c[1]-maxR)}" width="${MM.f(w+0.6)}" height="${MM.f(maxR*2)}" fill="${pick(pal)}"/>`); x += w; }
    // stumps and stones still in the new-broken ground
    let stumps = ''; for (let q=0;q<7;q++){ const p=[c[0]+rr(-E.rx*0.6,E.rx*0.6), c[1]+rr(-E.ry*0.5,E.ry*0.5)]; if (!MM.inPoly(p,E.pts)) continue; stumps += `<circle cx="${MM.f(p[0])}" cy="${MM.f(p[1])}" r="${MM.f(rr(1.2,2))}" fill="#6a4a2a" stroke="#3a2610" stroke-width="0.4"/>`; }
    const cmp = ['North','North-East','East','South-East','South','South-West','West','North-West'][Math.round(MM.bearing(vc, c)/45)%8];
    out.push(`<g id="${ID(key)}" class="mz lot" data-char="${charName}" data-key="${key}" data-zname="${E.half ? 'Half lot' : 'Lot '+(k+1)} — ${E.name} (${cmp})" data-ztext="${E.reason.replace(/"/g,'&quot;')}" style="cursor:pointer">
  <path class="zo" d="${dd}" fill="${pal[0]}" stroke="none"/>
  <g clip-path="url(#${ID('cx'+j)})"><g transform="rotate(${MM.f(ang)} ${MM.f(c[0])} ${MM.f(c[1])})">${rects.join('')}</g><path d="${dd}" fill="url(#${ID('furx'+j)})"/>${stumps}<path d="${dd}" fill="none" stroke="#3a2a08" stroke-width="8" opacity="0.1"/></g>
  <path d="${dd}" fill="none" stroke="#7a5a2a" stroke-width="2.2" stroke-dasharray="5 2.5" opacity="0.75"/>
</g>`);
    E.key = key; E.num = k+1;
  });

  // raid overlays live just above the fields
  out.push(`<g id="${ID('raid')}" pointer-events="none"></g>`);

  // ════ VILLAGE GROUND (interactive) ════
  const greenC = cfg.villageStyle==='green' ? [vc[0] + rr(-8,8), vc[1] + rr(-8,8)] : null;
  // churchyard: sits between roads, away from the hall
  const roadBear = roads.filter(r => MM.dist(r.pts[0], vc) < 2).map(r => MM.bearing(vc, r.pts[Math.min(12, r.pts.length-1)]));
  let chB = 0, chScore = -1;
  for (let b=0; b<360; b+=5){ const s = Math.min(...roadBear.map(x=>MM.angDiff(x,b)), MM.angDiff(hb,b)*0.8); if (s>chScore){ chScore=s; chB=b; } }
  const chR = (cfg.villageStyle==='green' ? 52 : 44);
  const church = [vc[0]+MM.dir(chB)[0]*chR, vc[1]+MM.dir(chB)[1]*chR];
  const yardR = cfg.bonusSite==='graveyard' ? [30,23] : [22,17];
  keepClear.push([church[0], church[1], yardR[0]+6]);

  // the lord's close
  const hc = [vc[0]+MM.dir(hb)[0]*(rInB[snap(hb)] + bulge*0.52), vc[1]+MM.dir(hb)[1]*(rInB[snap(hb)] + bulge*0.52)];
  const cw = 118, ch = 96;
  const inClose = (p, m) => Math.abs(p[0]-hc[0]) < cw/2+(m||0) && Math.abs(p[1]-hc[1]) < ch/2+(m||0);
  keepClear.push([hc[0], hc[1], 78]);

  const crofts = [], houses = [];
  const freeSpot = (p, r) => inVillage(p) && MM.inPoly(p, innerPoly) && !inClose(p, 14 + r) && MM.dist(p, church) > yardR[0]+r+4 && houses.every(h => MM.dist(h, p) > h[4] + r) && riverGap(p) > 10 && (!greenC || MM.dist(p, greenC) > 30 + r);
  // houses along every road that leaves the village
  roads.filter(r => MM.dist(r.pts[0], vc) < 2).forEach(r => {
    let s = 0;
    for (let i=3; i<r.pts.length-1; i++){
      s += MM.dist(r.pts[i-1], r.pts[i]); if (s < rr(17,23)) continue; s = 0;
      const p = r.pts[i]; if (!inVillage(p)) break;
      const n = MM.normals(r.pts.slice(i-1,i+2))[1], ang = Math.atan2(r.pts[i+1][1]-r.pts[i-1][1], r.pts[i+1][0]-r.pts[i-1][0])*180/Math.PI;
      [-1,1].forEach(side => { if (rnd()<0.18) return;
        const off = rr(13,16), h = [p[0]+n[0]*side*off, p[1]+n[1]*side*off];
        const w = rr(15,24), d = rr(8,11);
        if (!freeSpot(h, 10)) return;
        houses.push([h[0], h[1], w, d, 11, ang + rr(-6,6), pick(['thatch','thatch','thatch','thatchD','timber'])]);
        if (rnd()<0.4){ const q=[p[0]+n[0]*side*(off+13)+rr(-6,6), p[1]+n[1]*side*(off+13)+rr(-6,6)]; if (freeSpot(q,6)) houses.push([q[0],q[1],rr(8,11),rr(6,7),7,ang+90+rr(-8,8),pick(['byre','thatchD'])]); }
        const cp = [p[0]+n[0]*side*(off+26), p[1]+n[1]*side*(off+26)];
        if (inVillage(cp) && !inClose(cp,10) && MM.dist(cp, church) > yardR[0]+14) crofts.push([cp[0], cp[1], rr(16,22), rr(22,30), ang, rnd()]);
      });
    }
  });
  // houses round the green
  if (greenC){ for (let a=0; a<360; a+=rr(20,28)){ const d=MM.dir(a), p=[greenC[0]+d[0]*rr(42,48), greenC[1]+d[1]*rr(36,42)];
      if (roadGap(p) < 11 || !freeSpot(p,9)) continue; houses.push([p[0],p[1],rr(15,22),rr(8,10.5),10,a+90+rr(-8,8),pick(['thatch','thatch','thatchD','timber'])]);
      const cp=[greenC[0]+d[0]*66, greenC[1]+d[1]*58]; if (inVillage(cp) && !inClose(cp,10)) crofts.push([cp[0],cp[1],rr(14,18),rr(18,24),a+90,rnd()]); } }
  // fill-in cottages and byres
  for (let k=0; k<160 && houses.length<60; k++){ const a=rr(0,360), d=MM.dir(a), r=rInB[snap(a)]*rr(0.25,0.86), p=[vc[0]+d[0]*r, vc[1]+d[1]*r];
    if (roadGap(p) < 11 || !freeSpot(p, 9)) continue; const big = rnd()<0.5;
    houses.push([p[0],p[1],big?rr(14,20):rr(8,12),big?rr(8,10):rr(6,7.5),big?10:7,rr(0,180),pick(['thatch','thatchD','timber','byre'])]);
    if (rnd()<0.5){ const cp=[p[0]+rr(-22,22), p[1]+rr(-22,22)]; if (inVillage(cp) && !inClose(cp,12) && MM.dist(cp,church)>yardR[0]+12 && roadGap(cp)>14) crofts.push([cp[0],cp[1],rr(14,20),rr(18,26),rr(0,180),rnd()]); } }
  houses.forEach(h => keepClear.push([h[0],h[1],10]));

  const vdd = MM.d(innerPoly, true);
  out.push(`<g id="${ID('village')}" class="mz" data-char="${charName}" data-key="village" style="cursor:pointer">
  <path class="zo" d="${vdd}" fill="${t.village}" stroke="none"/>
  <path d="${vdd}" fill="url(#${ID('pgrass')})" opacity="0.6"/>
  ${crofts.map(([x,y,w,d,a,v]) => `<g transform="translate(${MM.f(x)} ${MM.f(y)}) rotate(${MM.f(a)})"><rect x="${MM.f(-d/2)}" y="${MM.f(-w/2)}" width="${MM.f(d)}" height="${MM.f(w)}" fill="${v<0.4?'#a9b56a':v<0.75?'#b8aa6a':'#9fae62'}" stroke="#6b5530" stroke-width="0.7" stroke-dasharray="${v<0.5?'2 1.2':'none'}"/>${v<0.6?`<path d="M${MM.f(-d/2+2)} ${MM.f(-w/2+3)}V${MM.f(w/2-3)}M0 ${MM.f(-w/2+3)}V${MM.f(w/2-3)}M${MM.f(d/2-2)} ${MM.f(-w/2+3)}V${MM.f(w/2-3)}" stroke="#5a6a2a" stroke-width="1" opacity="0.5"/>`:''}</g>`).join('')}
  ${greenC ? `<path d="${MM.d(MM.wobble(MM.resample(MM.cr([[greenC[0]+30,greenC[1]],[greenC[0],greenC[1]+23],[greenC[0]-30,greenC[1]],[greenC[0],greenC[1]-23],[greenC[0]+30,greenC[1]]],6),5),3,rnd,30),true)}" fill="#a8c070" stroke="#6a7a38" stroke-width="0.8"/><path d="${MM.ell(greenC[0]+8,greenC[1]+5,7,4.5)}" fill="${WT.fill}" stroke="${WT.bank}" stroke-width="0.7"/>` : ''}
</g>`);

  // ════ HEDGES, BALKS, STREAMS (decor) ════
  const bushes = [], bushHi = [], hedgeLines = [], balks = [];
  function hedge(pts, opts){
    opts = opts || {}; const P = MM.resample(pts, 4.2);
    hedgeLines.push(MM.d(P));
    P.forEach((p,i) => { if (!inView(p, 12)) return; if (roadGap(p) < 5 || riverGap(p) < 2) return;
      const r = rr(1.8, 3.2); bushes.push([p[0]+rr(-1,1), p[1]+rr(-1,1), r]); if (rnd()<0.35) bushHi.push([p[0]-0.8, p[1]-0.9, r*0.5]);
      if (!opts.noTrees && i%Math.floor(rr(9,17))===0 && rnd()<0.6 && roadGap(p) > 10) trees.push([p[0]+rr(-2,2), p[1]+rr(-2,2), rr(6,9.5), pick([0,1,1,2])]); });
  }
  hedge(outerPoly.concat([outerPoly[0]]));
  extraLots.forEach(E => { const ring = MM.offset(E.pts.concat([E.pts[0]]), 0).map(p => [E.c[0]+(p[0]-E.c[0])*1.06, E.c[1]+(p[1]-E.c[1])*1.06]); hedge(ring, {noTrees: true}); });
  radials.forEach(r => { if (rnd()<0.4) hedge(r, {noTrees: rnd()<0.5}); else balks.push(MM.d(r)); });
  zones.forEach((z,k) => { const nz = zones[(k+1)%zones.length];
    if (z.k==='woodland' || nz.k==='woodland') return;
    const pts = zRad[(k+1)%zones.length].filter(p => inView(p, 40)); if (pts.length>2) hedge(pts); });
  // a few closes cut out of the pasture and meadow
  ['pasture','meadow','fallow'].forEach(k => { const z = zoneOf(k); if (!z) return;
    const span = ((z.b - z.a + N) % N) * STEP; const n = k==='pasture' ? 2 : 1;
    for (let j=1;j<=n;j++){ const b = z.a*STEP + span*j/(n+1) + rr(-6,6), d=MM.dir(b), p0=ptOut(snap(b));
      const pts = MM.resample(MM.line(p0, [vc[0]+d[0]*1200, vc[1]+d[1]*1200], 18, rnd, 10, 90), 6).filter(p => inView(p, 30) && riverGap(p) > 8);
      if (pts.length>3) hedge(pts, {noTrees: k==='meadow'}); } });

  ['pasture','fallow'].forEach(k => { const z = zoneOf(k); if (!z) return;
    const span = ((z.b - z.a + N) % N); const i0 = (z.a + Math.floor(span*rr(0.05,0.3)))%N, i1 = (z.a + Math.floor(span*rr(0.6,0.95)))%N;
    const extra = rr(70,130); const pts = [];
    for (let i=i0; i!==i1; i=(i+1)%N){ const d=MM.dir(i*STEP), r=rOut[i]+extra+Math.sin(i*0.35)*10; pts.push([vc[0]+d[0]*r, vc[1]+d[1]*r]); }
    const P = MM.wobble(MM.resample(pts,6), 10, rnd, 50).filter(p => inView(p,20) && riverGap(p)>8 && MM.inPoly(p, z.pts));
    if (P.length > 6) hedge(P); });

  // drainage ditches and little brooks in the meadow
  const ditches = [];
  { const z = zoneOf('meadow'); if (z) for (let k=0;k<4;k++){ const p = zoneSpot('meadow', rr(0.05,0.35), rr(-25,25)); if (!p) continue;
      let best=null, bd=1e9; rivers.forEach(rv => { const i=MM.nearIdx(p, rv.pts), q=rv.pts[i], dd=MM.dist(p,q); if (dd<bd){ bd=dd; best=q; } });
      if (best && bd < 260) ditches.push(MM.d(MM.line(p, best, 6, rnd, 6, 40))); } }

  out.push(`<g pointer-events="none">
  ${balks.map(d => `<path d="${d}" fill="none" stroke="#a6b56a" stroke-width="3.2" stroke-linecap="round" opacity="0.85"/><path d="${d}" fill="none" stroke="#6f7a3a" stroke-width="0.6" stroke-dasharray="1.5 3" opacity="0.7"/>`).join('')}
  ${ditches.map(d => `<path d="${d}" fill="none" stroke="${WT.bank}" stroke-width="2.4" stroke-linecap="round" opacity="0.45"/><path d="${d}" fill="none" stroke="${WT.fill}" stroke-width="1.3" stroke-linecap="round"/>`).join('')}
</g>`);

  // ════ TEXTURE SPRINKLES (tufts, flowers, gorse, stones, hills, beasts) ════
  const tuftD = tufts.filter(p=>inView(p,5)).map(([x,y]) => `M${MM.f(x-2.2)} ${MM.f(y)}l1.2 -2.6M${MM.f(x)} ${MM.f(y)}l0 -3.2M${MM.f(x+2.2)} ${MM.f(y)}l-1.2 -2.6`).join('');
  const flowerD = flowers.filter(p=>inView(p,5)).map(([x,y]) => MM.circ(x,y,0.9)).join('');
  const hillsSorted = hills.sort((a,b)=>a[1]-b[1]);
  out.push(`<g pointer-events="none">
  <path d="${tuftD}" fill="none" stroke="#3e5e1c" stroke-width="0.7" stroke-linecap="round" opacity="0.55"/>
  <path d="${flowerD}" fill="#f4ecc0" opacity="0.8"/>
  <path d="${flowers.filter((p,i)=>i%3===0&&inView(p,5)).map(([x,y])=>MM.circ(x+2,y+1,0.8)).join('')}" fill="#c87a9a" opacity="0.7"/>
  ${hillsSorted.map(([x,y,s]) => { const w=s*1.9, h=s*0.62, sk=rr(-0.25,0.25)*w; let hach='';
      for (let k=1;k<8;k++){ const u=k/8, px=x-w+2*w*u, top=y-h*Math.sin(Math.PI*u)*(1+0.0) + 0; const L=h*Math.sin(Math.PI*u)*0.75; if (u<0.35) continue; hach += `M${MM.f(px+sk*Math.sin(Math.PI*u)*0.5)} ${MM.f(top+1.5)}l${MM.f(L*0.25)} ${MM.f(L)}`; }
      return `<path d="M${MM.f(x-w)} ${MM.f(y)}C${MM.f(x-w*0.55+sk)} ${MM.f(y-h*1.35)} ${MM.f(x+w*0.35+sk)} ${MM.f(y-h*1.35)} ${MM.f(x+w)} ${MM.f(y)}Q${MM.f(x)} ${MM.f(y+h*0.25)} ${MM.f(x-w)} ${MM.f(y)}Z" fill="${t.hill}" opacity="0.7"/><path d="M${MM.f(x-w)} ${MM.f(y)}C${MM.f(x-w*0.55+sk)} ${MM.f(y-h*1.35)} ${MM.f(x+w*0.35+sk)} ${MM.f(y-h*1.35)} ${MM.f(x+w)} ${MM.f(y)}" fill="none" stroke="#7a5630" stroke-width="1.1" stroke-linecap="round" opacity="0.75"/><path d="${hach}" stroke="#7a5630" stroke-width="0.8" stroke-linecap="round" opacity="0.55"/>`; }).join('')}
  <path d="${gorse.filter(g=>inView(g,6)).map(([x,y,r])=>MM.circ(x+1.2,y+1.2,r)).join('')}" fill="#2a2a10" opacity="0.25"/>
  <path d="${gorse.filter(g=>inView(g,6)).map(([x,y,r])=>MM.circ(x,y,r)+MM.circ(x+r*0.8,y-r*0.3,r*0.7)).join('')}" fill="${cfg.waste==='downs'?'#5f7238':'#566a2a'}"/>
  <path d="${gorseF.filter(p=>inView(p,5)).map(([x,y])=>MM.circ(x,y,0.9)).join('')}" fill="#e8c63a" opacity="0.85"/>
  <path d="${stones.filter(s=>inView(s,5)).map(([x,y,r])=>MM.ell(x,y,r*1.3,r)).join('')}" fill="#b8b2a0" stroke="#6a6458" stroke-width="0.5"/>
  <path d="${hayc.map(([x,y])=>MM.ell(x+2,y+1.8,4.4,3)).join('')}" fill="#2a2a10" opacity="0.28"/>
  <path d="${hayc.map(([x,y])=>MM.circ(x,y,4)).join('')}" fill="#e0cc84" stroke="#6a5420" stroke-width="0.7"/>
  <path d="${hayc.map(([x,y])=>`M${MM.f(x-2.6)} ${MM.f(y-1)}q2.6 -2.6 5.2 0M${MM.f(x-1.6)} ${MM.f(y+1.4)}q1.6 -1.6 3.2 0`).join('')}" stroke="#8a7030" stroke-width="0.5" fill="none"/>
  <path d="${cattle.map(([x,y,a])=>`M${MM.f(x-4)} ${MM.f(y)}a4 2.4 0 1 0 8 0a4 2.4 0 1 0 -8 0`).join('')}" fill="#7a4a28" stroke="#3a2010" stroke-width="0.4"/>
  <path d="${sheepB.map(([x,y])=>MM.ell(x+0.8,y+0.9,3.4,2.3)).join('')}" fill="#3a3418" opacity="0.28"/>
  <path d="${sheepB.map(([x,y])=>MM.ell(x,y,3.2,2.2)).join('')}" fill="#f4f0e2" stroke="#7a7460" stroke-width="0.45"/>
  <path d="${sheepB.map(([x,y,a])=>MM.circ(x+Math.cos(a)*3.4,y+Math.sin(a)*1.2,1)).join('')}" fill="#2a2418"/>
</g>`);

  // ════ RIVERS ════
  const reeds = [];
  const riverSvg = rivers.map(rv => {
    const dd = MM.d(rv.pts), w = rv.width;
    // reeds along the banks
    MM.offset(rv.pts, w/2+2.5).concat(MM.offset(rv.pts, -(w/2+2.5))).forEach((p,i) => { if (i%3===0 && rnd()<0.5 && inView(p,4) && roadGap(p) > 8) reeds.push(p); });
    // islands on a big river
    let isl = '';
    if (w >= 16){ for (let k=0;k<3;k++){ const i = Math.floor(rr(0.15,0.85)*rv.pts.length), p=rv.pts[i]; if (!inView(p,-20)) continue;
      const a = Math.atan2(rv.pts[Math.min(i+2,rv.pts.length-1)][1]-p[1], rv.pts[Math.min(i+2,rv.pts.length-1)][0]-p[0])*180/Math.PI;
      isl += `<g transform="translate(${MM.f(p[0])} ${MM.f(p[1])}) rotate(${MM.f(a)})"><ellipse rx="${MM.f(w*0.7)}" ry="${MM.f(w*0.16)}" fill="#c9c08a" stroke="#7a7448" stroke-width="0.6"/><ellipse rx="${MM.f(w*0.4)}" ry="${MM.f(w*0.08)}" fill="#9cb06a"/></g>`; } }
    return `<path d="${dd}" fill="none" stroke="#9cb07a" stroke-width="${w+10}" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
<path d="${dd}" fill="none" stroke="${WT.bank}" stroke-width="${w+2.6}" stroke-linecap="round" stroke-linejoin="round"/>
<path d="${dd}" fill="none" stroke="${WT.fill}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>
<path d="${dd}" fill="none" stroke="${WT.deep}" stroke-width="${MM.f(w*0.35)}" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
<path d="${MM.d(MM.offset(rv.pts, -w*0.22))}" fill="none" stroke="${WT.shine}" stroke-width="${MM.f(Math.max(0.8,w*0.1))}" stroke-dasharray="${MM.f(8+w)} ${MM.f(10+w*1.5)}" stroke-linecap="round" opacity="0.7"/>
${isl}`;
  }).join('');
  out.push(`<g pointer-events="none">${riverSvg}
  <path d="${reeds.map(([x,y])=>`M${MM.f(x)} ${MM.f(y)}l-1.4 -3.6M${MM.f(x+1.4)} ${MM.f(y)}l0.4 -4M${MM.f(x+2.6)} ${MM.f(y)}l1.6 -3.2`).join('')}" stroke="#4a6a24" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.8"/>
</g>`);

  // ════ MILL (on the leat beside the nearest river) ════
  const mainRiver = rivers.reduce((best, rv) => MM.near(vc, rv.pts) < MM.near(vc, best.pts) ? rv : best, rivers[0]);
  let mi = 10, mBest = 1e9;
  for (let i=16; i<mainRiver.pts.length-16; i++){ const p = mainRiver.pts[i]; if (!inView(p,-30)) continue; const sc0 = MM.dist(p, vc) + (roadGap(p) < 85 ? 400 : 0); if (sc0 < mBest){ mBest = sc0; mi = i; } }
  const mn = MM.normals(mainRiver.pts)[mi];
  const toV = Math.sign((vc[0]-mainRiver.pts[mi][0])*mn[0] + (vc[1]-mainRiver.pts[mi][1])*mn[1]) || 1;
  const leatPts = []; const LS = 16;
  for (let j=-LS; j<=LS; j++){ const i = Math.max(0, Math.min(mainRiver.pts.length-1, mi+j)), p = mainRiver.pts[i], n = MM.normals(mainRiver.pts)[i];
    const o = toV*(mainRiver.width/2 + 15*Math.sin(Math.PI*(j+LS)/(2*LS))); leatPts.push([p[0]+n[0]*o, p[1]+n[1]*o]); }
  const millP = leatPts[LS+3], pondP = leatPts[LS-6];
  keepClear.push([millP[0], millP[1], 26]);
  const millAng = Math.atan2(leatPts[LS+5][1]-leatPts[LS+1][1], leatPts[LS+5][0]-leatPts[LS+1][0])*180/Math.PI;

  // ════ TREES (all woods, copses, hedgerow trees) ════
  rivers.forEach(rv => { [1,-1].forEach(side => { const off = MM.offset(rv.pts, side*(rv.width/2 + 7));
    off.forEach((p,i) => { if (i%4 || rnd() > 0.32) return; if (!inView(p,6) || roadGap(p) < 14 || inVillage(p) || !clearOf(p)) return;
      if (MM.near(p, outerPoly) < 6) return; trees.push([p[0]+rr(-2,2), p[1]+rr(-2,2), rr(4.5,7.5), 3]); }); }); });
  ['pasture','meadow','fallow','waste'].forEach(k => { const z = zoneOf(k); if (!z) return;
    const n = k==='pasture' ? 3 : k==='waste' ? 2 : 1;
    for (let c=0;c<n;c++){ const p0 = zoneSpot(k, rr(0.2,0.9), rr(-40,40)); if (!p0 || reserved(p0) || (siteSpot && MM.dist(p0,siteSpot)<60)) continue;
      const m = 5 + Math.floor(rnd()*9); for (let j=0;j<m;j++){ const p=[p0[0]+rr(-18,18), p0[1]+rr(-13,13)]; if (MM.inPoly(p,z.pts) && treeOK(p,6)) trees.push([p[0],p[1],rr(6,10),pick([0,1,1,2])]); } } });
  // croft trees and a few village trees
  crofts.forEach(([x,y]) => { if (rnd()<0.35 && clearOf([x,y])) trees.push([x+rr(-4,4), y+rr(-4,4), rr(4.5,6.5), 1]); });
  const T = trees.filter(([x,y,r]) => inView([x,y], r+2) && clearOf([x,y])).sort((a,b)=>a[1]-b[1]);
  const crown = (x,y,r) => r > 8.5 ? MM.circ(x-r*0.32,y+r*0.08,r*0.72) + MM.circ(x+r*0.34,y+r*0.12,r*0.7) + MM.circ(x,y-r*0.28,r*0.74) : MM.circ(x,y,r*0.85);
  out.push(`<g pointer-events="none">
  <path d="${T.map(([x,y,r])=>MM.circ(x+r*0.32,y+r*0.38,r*0.86)).join('')}" fill="#14220a" opacity="0.32"/>
  ${[0,1,2,3].map(v => `<path d="${T.filter(q=>q[3]===v).map(([x,y,r])=>crown(x,y,r)).join('')}" fill="${v===3?'#8aa070':t.trees[v]}" stroke="#1e3410" stroke-width="0.45" stroke-opacity="0.55"/>`).join('')}
  <path d="${T.map(([x,y,r])=>MM.circ(x-r*0.26,y-r*0.3,r*0.38)).join('')}" fill="#d8e8a0" opacity="0.22"/>
</g>`);

  // ════ HEDGES (on top of the trees' feet) ════
  out.push(`<g pointer-events="none">
  ${hedgeLines.map(d => `<path d="${d}" fill="none" stroke="${t.hedge}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>`).join('')}
  <path d="${bushes.map(([x,y,r])=>MM.circ(x+0.9,y+1,r)).join('')}" fill="#1a2a0a" opacity="0.3"/>
  <path d="${bushes.map(([x,y,r])=>MM.circ(x,y,r)).join('')}" fill="${t.trees[1]}"/>
  <path d="${bushHi.map(([x,y,r])=>MM.circ(x,y,r)).join('')}" fill="#cfe090" opacity="0.35"/>
</g>`);

  // ════ DITCH & RAMPART round the whole settlement (improvement) ════
  if (has('Ditch and Rampart around everything')){
    const ring = []; for (let i=0;i<N;i++){ const d=MM.dir(i*STEP), r=rIn[i]+16; ring.push([vc[0]+d[0]*r, vc[1]+d[1]*r]); } ring.push(ring[0]);
    const R2 = MM.resample(ring, 5), nn = MM.normals(R2);
    const zig = R2.map((p,i) => { const o = (Math.floor(i/1)%2) ? 4 : -1; return [p[0]+nn[i][0]*o, p[1]+nn[i][1]*o]; });
    const imp = 'Ditch and Rampart around everything', inv = INVESTMENT_DATA[imp] || {};
    out.push(`<g id="${ID('improv-Ditch_and_Rampart_around_everything')}" class="mz" data-char="${charName}" data-key="improv-${imp.replace(/[^a-z0-9]/gi,'_')}" data-improv-name="Ditch &amp; Rampart" data-improv-text="${mmTip(inv)}" style="cursor:pointer">
  <path class="zo" d="${MM.d(MM.offset(R2,4))}" fill="none" stroke="#5a4a2a" stroke-width="5" opacity="0.45"/>
  <path d="${MM.d(R2)}" fill="none" stroke="#9e8e58" stroke-width="7" stroke-linejoin="round"/>
  <path d="${MM.d(zig)}" fill="none" stroke="#2a1a08" stroke-width="1.6" stroke-linejoin="miter"/>
  <path d="${MM.d(MM.offset(R2,-3.5))}" fill="none" stroke="#c4b47a" stroke-width="1.2" opacity="0.8"/>
</g>`);
  }

  // ════ ROADS, FOOTPATHS, BRIDGES ════
  const paths = [];
  const footTo = (target, wob) => { const a = MM.bearing(vc, target), d=MM.dir(a), r=rInB[snap(a)]*0.85, p0=[vc[0]+d[0]*r, vc[1]+d[1]*r]; paths.push(MM.d(MM.resample(MM.line(p0, target, wob||10, rnd, 8, 60), 5))); };
  footTo(millP, 8);
  extraLots.forEach(E => { footTo(E.c, 12); if (E.kind==='pilgrims' && siteSpot) paths.push(MM.d(MM.resample(MM.line(E.c, siteSpot, 8, rnd, 8, 50), 5))); });
  { const fp = zoneSpot('pasture', 0.35); if (fp) footTo(fp, 14); const fw = zoneSpot('woodland', 0.08); if (fw) footTo(fw, 14); }
  const roadSvg = roads.map(rd => {
    const dd = MM.d(rd.pts);
    if (rd.type==='good') return `<path d="${dd}" fill="none" stroke="${t.roadEdge}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
<path d="${dd}" fill="none" stroke="${t.road}" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="${MM.d(MM.offset(rd.pts,1.5))}" fill="none" stroke="#8a7040" stroke-width="0.6" opacity="0.45" stroke-dasharray="6 3"/>
<path d="${MM.d(MM.offset(rd.pts,-1.5))}" fill="none" stroke="#8a7040" stroke-width="0.6" opacity="0.45" stroke-dasharray="4 4"/>`;
    return `<path d="${dd}" fill="none" stroke="${t.roadEdge}" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.38"/>
<path d="${dd}" fill="none" stroke="${t.road}" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
<path d="${MM.d(MM.offset(rd.pts,1))}" fill="none" stroke="#7a5a30" stroke-width="0.6" opacity="0.55" stroke-dasharray="3 2.5"/>
<path d="${MM.d(MM.offset(rd.pts,-1))}" fill="none" stroke="#7a5a30" stroke-width="0.6" opacity="0.55" stroke-dasharray="2 3"/>`;
  }).join('');
  // where roads cross rivers: a bridge on a good road, a ford on a track
  const crossings = [];
  roads.forEach(rd => rivers.forEach(rv => {
    for (let i=1;i<rd.pts.length;i++) for (let j=1;j<rv.pts.length;j++){ const x = MM.segX(rd.pts[i-1], rd.pts[i], rv.pts[j-1], rv.pts[j]);
      if (x && crossings.every(c => MM.dist(c.p, x) > 20)){ const a = Math.atan2(rd.pts[i][1]-rd.pts[i-1][1], rd.pts[i][0]-rd.pts[i-1][0])*180/Math.PI; crossings.push({p:x, a, w:rv.width, good:rd.type==='good'}); } } }));
  const bridgeSvg = crossings.map(c => c.good
    ? `<g transform="translate(${MM.f(c.p[0])} ${MM.f(c.p[1])}) rotate(${MM.f(c.a)})"><rect x="${MM.f(-c.w/2-7)}" y="-6.5" width="${MM.f(c.w+14)}" height="13" rx="2" fill="#3a2a18" opacity="0.3" transform="translate(1.5 1.5)"/><rect x="${MM.f(-c.w/2-7)}" y="-6" width="${MM.f(c.w+14)}" height="12" rx="2" fill="#bdb29a" stroke="#5a5040" stroke-width="0.9"/><path d="M${MM.f(-c.w/2-6)} -4.2H${MM.f(c.w/2+6)}M${MM.f(-c.w/2-6)} 4.2H${MM.f(c.w/2+6)}" stroke="#6a6050" stroke-width="1.4"/><path d="M${MM.f(-c.w/2+2)} -6v12M${MM.f(c.w/2-2)} -6v12" stroke="#8a8070" stroke-width="0.6"/></g>`
    : `<g transform="translate(${MM.f(c.p[0])} ${MM.f(c.p[1])}) rotate(${MM.f(c.a)})">${Array.from({length:Math.max(3,Math.round(c.w/3.5))}, (_,k) => `<ellipse cx="${MM.f(-c.w/2 + (k+0.5)*c.w/Math.max(3,Math.round(c.w/3.5)))}" cy="${MM.f(rr(-1.2,1.2))}" rx="1.6" ry="1.3" fill="#d8d0b8" stroke="#5a5446" stroke-width="0.5"/>`).join('')}</g>`).join('');
  out.push(`<g pointer-events="none">
  ${paths.map(d => `<path d="${d}" fill="none" stroke="#7a5a30" stroke-width="1.1" stroke-dasharray="1 3.2" stroke-linecap="round" opacity="0.75"/>`).join('')}
  ${roadSvg}
  ${bridgeSvg}
</g>`);

  // ════ BUILDINGS (village) ════
  const roofs = { thatch:['#cfae6a','#a9884a'], thatchD:['#b8955a','#8e7038'], timber:['#9a7452','#6e5034'], byre:['#a99a6a','#7e7048'], stone:['#a8a394','#7e7a6e'], shingle:['#8a6a4e','#5e4632'] };
  function bld(x,y,w,d,ang,kind){
    const c = roofs[kind] || roofs.thatch, rx = kind.startsWith('thatch') ? Math.min(3, d*0.35) : 0.6;
    return `<g transform="translate(${MM.f(x)} ${MM.f(y)}) rotate(${MM.f(ang)})"><rect x="${MM.f(-w/2+1.6)}" y="${MM.f(-d/2+1.8)}" width="${MM.f(w)}" height="${MM.f(d)}" rx="${rx}" fill="#2a1a08" opacity="0.35"/><rect x="${MM.f(-w/2)}" y="${MM.f(-d/2)}" width="${MM.f(w)}" height="${MM.f(d)}" rx="${rx}" fill="${c[1]}" stroke="#3a2610" stroke-width="0.6"/><rect x="${MM.f(-w/2+0.4)}" y="${MM.f(-d/2+0.4)}" width="${MM.f(w-0.8)}" height="${MM.f(d/2-0.4)}" rx="${MM.f(Math.max(0,rx-0.4))}" fill="${c[0]}"/><path d="M${MM.f(-w/2+rx*0.6)} 0H${MM.f(w/2-rx*0.6)}" stroke="#4a3418" stroke-width="0.8"/></g>`;
  }
  const bldSvg = houses.map(h => bld(h[0],h[1],h[2],h[3],h[5],h[6])).join('');
  // ════ OUTLYING HAMLETS for the extra lots ════
  const hamlet = [];
  extraLots.forEach(E => {
    // huts on the side facing the village, just outside the field
    const toV = MM.bearing(E.c, vc), n = E.kind==='pilgrims' ? 3 : 5;
    for (let q=0;q<n;q++){ const a = toV + (q-(n-1)/2)*26 + rr(-6,6), d = MM.dir(a), r = Math.max(E.rx,E.ry)*0.9 + rr(10,16);
      const p = [E.c[0]+d[0]*r, E.c[1]+d[1]*r]; if (MM.inPoly(p, E.pts) || roadGap(p) < 8 || riverGap(p) < 8) continue;
      hamlet.push(bld(p[0], p[1], rr(9,13), rr(6,7.5), a+90+rr(-10,10), E.kind==='pilgrims' ? 'thatch' : pick(['byre','thatchD','byre']))); }
    const d0 = MM.dir(toV + 180), far = Math.max(E.rx,E.ry) + 14, p0 = [E.c[0]+d0[0]*far, E.c[1]+d0[1]*far];
    if (E.kind==='pilgrims'){
      // the pilgrims' hostel and a wayside cross on the path to the stones
      const hp = [E.c[0]+MM.dir(toV+70)[0]*(far+6), E.c[1]+MM.dir(toV+70)[1]*(far+6)];
      if (!MM.inPoly(hp, E.pts)) hamlet.push(bld(hp[0], hp[1], 26, 11, toV+160, 'thatchD'));
      if (siteSpot){ const m = [E.c[0]*0.45+siteSpot[0]*0.55, E.c[1]*0.45+siteSpot[1]*0.55];
        hamlet.push(`<path d="M${MM.f(m[0])} ${MM.f(m[1]-7)}v10M${MM.f(m[0]-3.5)} ${MM.f(m[1]-4)}h7" stroke="#4a3418" stroke-width="1.6" stroke-linecap="round"/>`); }
    } else {
      // a pen for the beasts they brought with them
      if (!MM.inPoly(p0, E.pts) && roadGap(p0) > 10) hamlet.push(`<path d="${MM.ell(p0[0],p0[1],11,8)}" fill="#b8b07a" stroke="#5a3e1c" stroke-width="1.2" stroke-dasharray="1.4 1.4"/><ellipse cx="${MM.f(p0[0]-3)}" cy="${MM.f(p0[1])}" rx="3" ry="2" fill="#f2eee0" stroke="#6a6450" stroke-width="0.4"/><ellipse cx="${MM.f(p0[0]+3)}" cy="${MM.f(p0[1]+2)}" rx="3" ry="2" fill="#7a4a28"/>`);
    }
  });

  out.push(`<g pointer-events="none">${bldSvg}${hamlet.join('')}</g>`);

  // ════ CHURCH + CHURCHYARD ════
  {
    const a = chB + 90 + rr(-8,8), [x,y] = church, haunted = cfg.bonusSite==='graveyard';
    const yd = MM.d(MM.wobble(MM.resample(MM.cr([[x+yardR[0],y],[x,y+yardR[1]],[x-yardR[0],y],[x,y-yardR[1]],[x+yardR[0],y]],6),4),2,rnd,30), true);
    let graves = ''; for (let k=0;k<(haunted?30:12);k++){ const g=[x+rr(-yardR[0]*0.8,yardR[0]*0.8), y+rr(-yardR[1]*0.8,yardR[1]*0.8)]; if (Math.hypot((g[0]-x)/yardR[0],(g[1]-y)/yardR[1])>0.85 || Math.hypot(g[0]-x,g[1]-y)<13) continue;
      graves += haunted && rnd()<0.4 ? `<path d="M${MM.f(g[0])} ${MM.f(g[1]-2.6)}v5.2M${MM.f(g[0]-1.6)} ${MM.f(g[1]-1.2)}h3.2" stroke="#4a4438" stroke-width="0.8" transform="rotate(${MM.f(rr(-20,20))} ${MM.f(g[0])} ${MM.f(g[1])})"/>` : `<rect x="${MM.f(g[0]-1.2)}" y="${MM.f(g[1]-0.8)}" width="2.4" height="1.6" fill="#9a9484" stroke="#4a4438" stroke-width="0.4"/>`; }
    const yews = [[x-yardR[0]*0.6,y+yardR[1]*0.45],[x+yardR[0]*0.55,y-yardR[1]*0.5]].map(([a1,b1]) => `<path d="${MM.circ(a1+1.5,b1+1.5,4.6)}" fill="#0a1a08" opacity="0.3"/><path d="${MM.circ(a1,b1,4.6)}" fill="#24401c"/>`).join('');
    const mist = haunted ? `<g filter="url(#${ID('mist')})" opacity="0.55"><ellipse cx="${MM.f(x-6)}" cy="${MM.f(y+6)}" rx="24" ry="8" fill="#f2f4f6"/><ellipse cx="${MM.f(x+12)}" cy="${MM.f(y-6)}" rx="16" ry="6" fill="#e8ecf2"/></g>` : '';
    out.push(`<g id="${ID('church')}" class="mz" data-char="${charName}" data-key="church" style="cursor:pointer">
  <path class="zo" d="${yd}" fill="${haunted?'#9aa47a':'#a9b874'}" stroke="#6a6250" stroke-width="1.6"/>
  ${graves}${yews}
  <g transform="translate(${MM.f(x)} ${MM.f(y)}) rotate(${MM.f(a)})">
    <rect x="-13" y="-5" width="26" height="12" fill="#2a1a08" opacity="0.3" transform="translate(2 2)"/>
    <rect x="-11" y="-5.5" width="20" height="11" fill="#8a8476" stroke="#3a3428" stroke-width="0.7"/><rect x="-11" y="-5.5" width="20" height="5.5" fill="#b0aa9a"/>
    <rect x="9" y="-4" width="8" height="8" fill="#8a8476" stroke="#3a3428" stroke-width="0.7"/><rect x="9" y="-4" width="8" height="4" fill="#b0aa9a"/>
    <rect x="-18" y="-4.5" width="8" height="9" fill="#9a9484" stroke="#3a3428" stroke-width="0.8"/><path d="M-18 -4.5L-10 4.5M-10 -4.5L-18 4.5" stroke="#5a5446" stroke-width="0.6"/>
    <path d="M-1 0H9M13 -2.5v5M11.5 0h3" stroke="#3a3428" stroke-width="0.6"/>
  </g>${mist}
</g>`);
  }

  // ════ THE HALL & LORD'S CLOSE ════
  const gateSide = (() => { const dx=vc[0]-hc[0], dy=vc[1]-hc[1]; return Math.abs(dx)/cw > Math.abs(dy)/ch ? (dx>0?'e':'w') : (dy>0?'s':'n'); })();
  const gateP = gateSide==='e' ? [hc[0]+cw/2, hc[1]] : gateSide==='w' ? [hc[0]-cw/2, hc[1]] : gateSide==='s' ? [hc[0], hc[1]+ch/2] : [hc[0], hc[1]-ch/2];
  const closePts = MM.wobble(MM.resample(MM.cr([[hc[0]-cw/2+8,hc[1]-ch/2],[hc[0]+cw/2-8,hc[1]-ch/2],[hc[0]+cw/2,hc[1]-ch/2+8],[hc[0]+cw/2,hc[1]+ch/2-8],[hc[0]+cw/2-8,hc[1]+ch/2],[hc[0]-cw/2+8,hc[1]+ch/2],[hc[0]-cw/2,hc[1]+ch/2-8],[hc[0]-cw/2,hc[1]-ch/2+8],[hc[0]-cw/2+8,hc[1]-ch/2]],6),4), 2.5, rnd, 40);
  const closeD = MM.d(closePts, true);
  const L = (lx,ly) => [hc[0]+lx*cw, hc[1]+ly*ch];
  // great hall with a cross-wing, kitchen, barn, stable, well
  const hallP = L(0,-0.1), barnP = L(-0.25,0.3), stabP = L(0.26,0.3);
  const fortified = has('Stone Wall');
  const hallBld = `
  <g transform="translate(${MM.f(hallP[0])} ${MM.f(hallP[1])})">

    <rect x="16" y="-14" width="13" height="29" fill="${fortified?'#7e7a6e':'#5e4632'}" stroke="#24160a" stroke-width="1"/>

  <circle cx="${MM.f(L(0.02,0.3)[0])}" cy="${MM.f(L(0.02,0.3)[1])}" r="3.2" fill="#3a5a7a" stroke="#4a3a28" stroke-width="1.4"/>`;
  const palisade = fortified ? '' : `<path d="${closeD}" fill="none" stroke="#5a3e1c" stroke-width="2.2"/><path d="${closeD}" fill="none" stroke="#2a1a08" stroke-width="3.6" stroke-dasharray="0.9 2.6" opacity="0.8"/>`;

  <path class="zo" d="${closeD}" fill="#cdb98a" stroke="none"/>
  <path d="${MM.ell(hc[0], hc[1]+4, cw*0.28, ch*0.2)}" fill="#b89e68" opacity="0.6"/>
  ${palisade}
  <path d="${MM.d([gateP, [gateP[0]*0.55+vc[0]*0.45, gateP[1]*0.55+vc[1]*0.45]])}" stroke="${t.road}" stroke-width="4" stroke-linecap="round"/>
  ${hallBld}
</g>`);

  // ════ IMPROVEMENTS ════
  const slots = [L(-0.36,-0.36), L(0.37,-0.36), L(-0.39,0.08), L(0.4,0.06), L(0.0,0.36)].filter(p => MM.dist(p,gateP) > 18);
  let slotI = 0; const nextSlot = () => slots[slotI++ % slots.length];
  const improvOut = [];
  // a plot just outside the village edge, near the hall, clear of roads, the close and other plots
  const plots = [];
  function plotSpot(baseOff){
    const extra = has('Ditch and Rampart around everything') ? 56 : 34;
    for (const off of [0, 12, -12, 24, -24, 36, -36, 50, -50, 65, -65]){
      const ob = hb + baseOff + off, d = MM.dir(ob), r = rIn[snap(ob)] + extra, c = [vc[0]+d[0]*r, vc[1]+d[1]*r];
      const corners = [[-32,-20],[32,-20],[32,20],[-32,20],[0,0],[0,-20],[0,20],[-32,0],[32,0]].map(([x,y]) => [c[0]+x, c[1]+y]);
      if (corners.some(q => roadGap(q) < 9 || riverGap(q) < 8 || inClose(q, 22) || reserved(q))) continue;
      if (plots.some(q => MM.dist(q, c) < 80) || (wcut && MM.dist(c, wcut.c) < 90)) continue;
      plots.push(c); return c; }
    const d = MM.dir(hb + baseOff), r = rIn[snap(hb + baseOff)] + extra; const c = [vc[0]+d[0]*r, vc[1]+d[1]*r]; plots.push(c); return c;
  }
  improvements.forEach(imp => {
    if (imp === 'Ditch and Rampart around everything') return;
    if (imp === 'Logging Station' && wcut) return;   // drawn as the woodcutters' camp
    const inv = Object.assign({}, MM_IMPROV_FALLBACK[imp] ? {notes: MM_IMPROV_FALLBACK[imp]} : {}, INVESTMENT_DATA[imp] || {});
    const key = 'improv-' + imp.replace(/[^a-z0-9]/gi,'_');
    const attrs = `id="${ID(key)}" class="mz" data-char="${charName}" data-key="${key}" data-improv-name="${imp}" data-improv-text="${mmTip(inv)}" style="cursor:pointer"`;
    const lab = (x,y,txt) => `<text x="${MM.f(x)}" y="${MM.f(y)}" text-anchor="middle" font-family="'Crimson Pro',serif" font-size="8.5" fill="#2a1406" ${halo()}>${txt}</text>`;
    if (imp === 'Moat'){
      const mx = cw/2+15, my = ch/2+15, k = 18;
      const m = MM.wobble(MM.resample(MM.cr([[hc[0]-mx+k,hc[1]-my],[hc[0]+mx-k,hc[1]-my],[hc[0]+mx,hc[1]-my+k],[hc[0]+mx,hc[1]+my-k],[hc[0]+mx-k,hc[1]+my],[hc[0]-mx+k,hc[1]+my],[hc[0]-mx,hc[1]+my-k],[hc[0]-mx,hc[1]-my+k],[hc[0]-mx+k,hc[1]-my]],8),5),2.5,rnd,40);
      const gm = [gateP[0]+(gateP[0]-hc[0])*0.22, gateP[1]+(gateP[1]-hc[1])*0.22], ga = (gateSide==='e'||gateSide==='w') ? 0 : 90;
      improvOut.push(`<g ${attrs}><path class="zo" d="${MM.d(m,true)}" fill="none" stroke="${WT.bank}" stroke-width="10.5"/><path d="${MM.d(m,true)}" fill="none" stroke="${WT.fill}" stroke-width="8"/><path d="${MM.d(m,true)}" fill="none" stroke="${WT.shine}" stroke-width="0.8" stroke-dasharray="10 14" opacity="0.7"/>
  <g transform="translate(${MM.f(gm[0])} ${MM.f(gm[1])}) rotate(${ga})"><rect x="-11" y="-4" width="22" height="8" fill="#8a6a42" stroke="#3a2610" stroke-width="0.8"/><path d="M-7 -4v8M-3 -4v8M1 -4v8M5 -4v8" stroke="#5a4020" stroke-width="0.5"/></g></g>`);
      return;
    }
    if (imp === 'Stone Wall'){
      const wpts = MM.offset(closePts.concat([closePts[0]]), 0);
      improvOut.push(`<g ${attrs}><path class="zo" d="${MM.d(wpts,true)}" fill="none" stroke="#4a463e" stroke-width="5.6" stroke-linejoin="round"/><path d="${MM.d(wpts,true)}" fill="none" stroke="#b4ae9c" stroke-width="3.6" stroke-linejoin="round"/><path d="${MM.d(wpts,true)}" fill="none" stroke="#6a665a" stroke-width="3.6" stroke-dasharray="2.4 2.4"/>
  ${[[-0.5,-0.5],[0.5,-0.5],[0.5,0.5],[-0.5,0.5]].map(([a1,b1]) => { const p=L(a1*0.97,b1*0.97); return `<rect x="${MM.f(p[0]-5)}" y="${MM.f(p[1]-5)}" width="10" height="10" fill="#9a9484" stroke="#3a362e" stroke-width="1"/><rect x="${MM.f(p[0]-5)}" y="${MM.f(p[1]-5)}" width="10" height="5" fill="#c0baa8"/>`; }).join('')}
  <rect x="${MM.f(gateP[0]-7)}" y="${MM.f(gateP[1]-7)}" width="14" height="14" fill="#8a8476" stroke="#3a362e" stroke-width="1"/><rect x="${MM.f(gateP[0]-3)}" y="${MM.f(gateP[1]-3)}" width="6" height="6" fill="#3a2a18"/></g>`);
      return;
    }
    if (imp === 'Vineyard'){
      const c = plotSpot(-52);
      keepClear.push([c[0],c[1],34]);
      let rows = ''; for (let j=-2;j<=2;j++){ rows += `<path d="M${MM.f(c[0]-27)} ${MM.f(c[1]+j*7)}H${MM.f(c[0]+27)}" stroke="#6a4a2a" stroke-width="0.7"/>`; for (let i=-3;i<=3;i++) rows += `<circle cx="${MM.f(c[0]+i*7.5+(j%2?3:0))}" cy="${MM.f(c[1]+j*7-1.2)}" r="2" fill="${(i+j)%2?'#5f7a3a':'#6a8a40'}"/><circle cx="${MM.f(c[0]+i*7.5+(j%2?3:0)+1)}" cy="${MM.f(c[1]+j*7)}" r="0.9" fill="#5a3a7a"/>`; }
      improvOut.push(`<g ${attrs}><rect class="zo" x="${MM.f(c[0]-31)}" y="${MM.f(c[1]-19)}" width="62" height="38" rx="3" fill="#c2b276" stroke="#5a4020" stroke-width="1.1" stroke-dasharray="3 1.5"/>${rows}${lab(c[0], c[1]+29, 'Vineyard')}</g>`);
      return;
    }
    if (imp === 'Orchard'){
      const c = plotSpot(52);
      keepClear.push([c[0],c[1],34]);
      let tr = ''; for (let i=-2;i<=2;i++) for (let j=-1;j<=1;j++){ const x=c[0]+i*11+(j%2?5:0), y=c[1]+j*11; tr += `<path d="${MM.circ(x+1.4,y+1.6,4.4)}" fill="#14220a" opacity="0.3"/><path d="${MM.circ(x,y,4.4)}" fill="${t.trees[2]}" stroke="#2a4010" stroke-width="0.5"/><circle cx="${MM.f(x+1.5)}" cy="${MM.f(y-1)}" r="0.9" fill="#c03a2a"/>`; }
      improvOut.push(`<g ${attrs}><rect class="zo" x="${MM.f(c[0]-32)}" y="${MM.f(c[1]-20)}" width="64" height="40" rx="3" fill="#a8bc72" stroke="#5a4020" stroke-width="1.1" stroke-dasharray="3 1.5"/>${tr}${lab(c[0], c[1]+29, 'Orchard')}</g>`);
      return;
    }
    if (imp === 'Sheep Herd'){
      const c = zoneSpot('pasture', 0.35) || zoneSpot('waste', 0.3); if (!c) return;
      improvOut.push(`<g ${attrs}><circle class="zo" cx="${MM.f(c[0])}" cy="${MM.f(c[1])}" r="17" fill="#c8cc8a" stroke="#6a4a20" stroke-width="2" stroke-dasharray="1.4 1.4"/>${Array.from({length:12},()=>{const x=c[0]+rr(-10,10), y=c[1]+rr(-9,9); return `<ellipse cx="${MM.f(x)}" cy="${MM.f(y)}" rx="3" ry="2.1" fill="#f6f2e4" stroke="#7a7460" stroke-width="0.4"/>`;}).join('')}${bld(c[0]+20, c[1]-12, 12, 7, 20, 'thatchD')}${lab(c[0], c[1]+28, 'Sheepfold')}</g>`);
      return;
    }
    if (imp === 'Fish Pond'){
      let p = null;
      for (let k=0;k<200 && !p;k++){ const u=rr(0.15,0.6), o=rr(-60,60), q=[millP[0]+(vc[0]-millP[0])*u, millP[1]+(vc[1]-millP[1])*u], d=MM.dir(MM.bearing(millP,vc)+90); const c0=[q[0]+d[0]*o, q[1]+d[1]*o];
        if (!inClose(c0, 40) && MM.dist(c0, church) > yardR[0]+30 && roadGap(c0) > 18 && riverGap(c0) > 16 && MM.dist(c0, millP) > 34 && houses.every(h=>MM.dist(h,c0)>24)) p = c0; }
      for (let k=0;k<300 && !p;k++){ const a0=rr(0,360), d=MM.dir(a0), c0=[vc[0]+d[0]*(rInB[snap(a0)]+rr(10,45)), vc[1]+d[1]*(rInB[snap(a0)]+rr(10,45))];
        if (!inClose(c0, 40) && MM.dist(c0, church) > yardR[0]+30 && roadGap(c0) > 18 && riverGap(c0) > 16 && houses.every(h=>MM.dist(h,c0)>24) && MM.dist(c0,millP) > 34) p = c0; }
      p = p || [millP[0]*0.6+vc[0]*0.4, millP[1]*0.6+vc[1]*0.4];
      improvOut.push(`<g ${attrs}><path class="zo" d="${MM.ell(p[0],p[1],18,11)}" fill="${WT.fill}" stroke="${WT.bank}" stroke-width="1.2"/><path d="M${MM.f(p[0]-8)} ${MM.f(p[1])}q4 -3 8 0t8 0" stroke="${WT.shine}" fill="none" stroke-width="0.8"/>${lab(p[0], p[1]+21, 'Fish Pond')}</g>`);
      return;
    }
    if (imp === 'Scriptorium'){
      // behind the manor: beyond the close on the side away from the village (and outside any rampart)
      const bb = MM.bearing(vc, hc) + rr(-12,12), d = MM.dir(bb);
      const r0 = rIn[snap(bb)] + (has('Ditch and Rampart around everything') ? 46 : 34), p = [vc[0]+d[0]*r0, vc[1]+d[1]*r0];
      keepClear.push([p[0], p[1], 30]);
      const back = [hc[0]+d[0]*(Math.min(cw,ch)/2), hc[1]+d[1]*(Math.min(cw,ch)/2)];
      improvOut.push(`<g ${attrs}><rect class="zo" x="${MM.f(p[0]-21)}" y="${MM.f(p[1]-15)}" width="42" height="30" rx="2" fill="#b6b98a" stroke="#6a665a" stroke-width="1.6"/>
  <path d="${MM.d([back, p])}" stroke="#7a5a30" stroke-width="1.1" stroke-dasharray="1 3" stroke-linecap="round"/>
  ${bld(p[0], p[1]-3, 24, 11, 0, 'stone')}
  <rect x="${MM.f(p[0]-16)}" y="${MM.f(p[1]+6)}" width="9" height="6" fill="#8aa04e" stroke="#4a5a28" stroke-width="0.4"/><rect x="${MM.f(p[0]+7)}" y="${MM.f(p[1]+6)}" width="9" height="6" fill="#7a9a48" stroke="#4a5a28" stroke-width="0.4"/>
  <circle cx="${MM.f(p[0])}" cy="${MM.f(p[1]+9)}" r="1.4" fill="#5a7a9a"/>
  ${lab(p[0], p[1]+24, 'Scriptorium')}</g>`);
      return;
    }
    if (imp === 'Jeweller' || imp.startsWith('Brewery')){
      let p = null; for (let k=0;k<40&&!p;k++){ const a=rr(0,360), d=MM.dir(a), q=[vc[0]+d[0]*rr(14,40), vc[1]+d[1]*rr(14,40)]; if (roadGap(q)>9 && MM.dist(q,church)>yardR[0]+10 && houses.every(h=>MM.dist(h,q)>12)) p=q; }
      p = p || [vc[0]+12, vc[1]-12];
      improvOut.push(`<g ${attrs}><rect class="zo" x="${MM.f(p[0]-9)}" y="${MM.f(p[1]-7)}" width="18" height="14" fill="none" stroke="none"/>${bld(p[0],p[1],15,9,rr(0,40),imp==='Jeweller'?'shingle':'timber')}${imp==='Jeweller'?`<path d="M${MM.f(p[0]+9)} ${MM.f(p[1]-9)}l1.2 2.6 2.6 1.2 -2.6 1.2 -1.2 2.6 -1.2 -2.6 -2.6 -1.2 2.6 -1.2z" fill="#f0d060" stroke="#8a6010" stroke-width="0.4"/>`:`<ellipse cx="${MM.f(p[0]+10)}" cy="${MM.f(p[1]+4)}" rx="3" ry="2" fill="#6a4028"/>`}${lab(p[0], p[1]+16, imp.replace(', Exclusive',''))}</g>`);
      return;
    }
    // everything else goes inside the close
    const p = nextSlot();
    let g = '';
    if (imp === 'Dovecote') g = `<circle cx="${MM.f(p[0]+1.5)}" cy="${MM.f(p[1]+1.5)}" r="7" fill="#1a0e04" opacity="0.35"/><circle class="zo" cx="${MM.f(p[0])}" cy="${MM.f(p[1])}" r="7" fill="#a8a394" stroke="#3a362e" stroke-width="0.9"/><path d="M${MM.f(p[0]-7)} ${MM.f(p[1])}A7 7 0 0 1 ${MM.f(p[0]+7)} ${MM.f(p[1])}" fill="#cac4b2"/><circle cx="${MM.f(p[0])}" cy="${MM.f(p[1])}" r="1.8" fill="#4a463e"/>` + [[-9,-8],[8,-10],[11,-3]].map(([a1,b1])=>`<path d="M${MM.f(p[0]+a1-2.5)} ${MM.f(p[1]+b1)}q1.2 -1.6 2.5 0q1.3 -1.6 2.5 0" stroke="#f8f6f0" stroke-width="0.9" fill="none"/>`).join('');
    else if (imp === 'Tall Wooden Tower') g = `<path d="M${MM.f(p[0]+6)} ${MM.f(p[1]+6)}l26 18 6 -6 -26 -18z" fill="#1a0e04" opacity="0.28"/><rect class="zo" x="${MM.f(p[0]-7)}" y="${MM.f(p[1]-7)}" width="14" height="14" fill="#6e5034" stroke="#24160a" stroke-width="1.1"/><rect x="${MM.f(p[0]-7)}" y="${MM.f(p[1]-7)}" width="14" height="7" fill="#9a7452"/><path d="M${MM.f(p[0]-7)} ${MM.f(p[1]-7)}L${MM.f(p[0]+7)} ${MM.f(p[1]+7)}M${MM.f(p[0]+7)} ${MM.f(p[1]-7)}L${MM.f(p[0]-7)} ${MM.f(p[1]+7)}" stroke="#3a2610" stroke-width="0.7"/>`;
    else if (imp === 'Herb Garden') g = `<rect class="zo" x="${MM.f(p[0]-12)}" y="${MM.f(p[1]-8)}" width="24" height="16" fill="#9aae62" stroke="#5a4a28" stroke-width="0.8"/>` + [0,1,2,3].map(k=>`<rect x="${MM.f(p[0]-11+(k%2)*12)}" y="${MM.f(p[1]-7+Math.floor(k/2)*8)}" width="10" height="6" fill="${['#7a9a48','#8aa84e','#6e8e42','#a0b05a'][k]}" stroke="#4a5a28" stroke-width="0.4"/>`).join('') + `<circle cx="${MM.f(p[0])}" cy="${MM.f(p[1])}" r="1.6" fill="#c8b0d8"/>`;
    else if (imp === 'Apiary') g = `<rect class="zo" x="${MM.f(p[0]-11)}" y="${MM.f(p[1]-6)}" width="22" height="12" fill="none" stroke="none"/>` + [-7,0,7].map(dx=>`<circle cx="${MM.f(p[0]+dx)}" cy="${MM.f(p[1])}" r="3.4" fill="#d4a840" stroke="#8a6010" stroke-width="0.6"/><circle cx="${MM.f(p[0]+dx)}" cy="${MM.f(p[1])}" r="1.6" fill="none" stroke="#8a6010" stroke-width="0.4"/>`).join('');
    else if (imp === 'Vineyard') g = `<rect class="zo" x="${MM.f(p[0]-12)}" y="${MM.f(p[1]-8)}" width="24" height="16" fill="#b8a86a" stroke="#5a4020" stroke-width="0.6"/>` + [-5,0,5].map(dy=>`<path d="M${MM.f(p[0]-11)} ${MM.f(p[1]+dy)}H${MM.f(p[0]+11)}" stroke="#6a4a2a" stroke-width="0.6"/>` + [-8,-3,2,7].map(dx=>`<circle cx="${MM.f(p[0]+dx)}" cy="${MM.f(p[1]+dy-1)}" r="1.4" fill="#6a4a88"/>`).join('')).join('');
    else g = `<rect class="zo" x="${MM.f(p[0]-9)}" y="${MM.f(p[1]-7)}" width="18" height="14" fill="none" stroke="none"/>${bld(p[0],p[1],15,10,0,'timber')}`;
    improvOut.push(`<g ${attrs}>${g}</g>`);
  });

  // ════ MILL (drawn now, over roads) ════
  out.push(`<g id="${ID('mill')}" class="mz" data-char="${charName}" data-key="mill" style="cursor:pointer">
  <path class="zo" d="${MM.ell(millP[0], millP[1], 30, 24)}" fill="#000" fill-opacity="0.001" stroke="none"/>
  <path d="${MM.d(leatPts)}" fill="none" stroke="${WT.bank}" stroke-width="6.4" stroke-linecap="round"/>
  <path d="${MM.d(leatPts)}" fill="none" stroke="${WT.fill}" stroke-width="4.4" stroke-linecap="round"/>
  <path d="${MM.ell(pondP[0], pondP[1], 15, 9)}" fill="${WT.fill}" stroke="${WT.bank}" stroke-width="1.2" transform="rotate(${MM.f(millAng)} ${MM.f(pondP[0])} ${MM.f(pondP[1])})"/>
  <g transform="translate(${MM.f(millP[0])} ${MM.f(millP[1])}) rotate(${MM.f(millAng)})">
    <rect x="-9" y="-13" width="18" height="11" fill="#2a1a08" opacity="0.35" transform="translate(1.6 1.6)"/>
    <rect x="-9" y="-14" width="18" height="11" fill="#6e5034" stroke="#2a1a08" stroke-width="0.8"/><rect x="-9" y="-14" width="18" height="5.5" fill="#9a7452"/>
    <rect x="-5" y="-2.5" width="10" height="5" rx="1" fill="#5a4024" stroke="#2a1a08" stroke-width="0.7"/>
    <path d="M-5 0H5M-3 -2.5V2.5M0 -2.5V2.5M3 -2.5V2.5" stroke="#2a1a08" stroke-width="0.5"/>
  </g>
</g>`);

  out.push(improvOut.join(''));

  // ════ WOODCUTTERS' CAMP ════
  if (wcut){
    const c = wcut.c, t0 = wcut.ang*Math.PI/180, nz=[rnd()*6.28, rnd()*6.28];
    const cl = []; for (let j=0;j<40;j++){ const a=j/40*Math.PI*2, w=1+0.14*Math.sin(3*a+nz[0])+0.08*Math.sin(7*a+nz[1]); const x=Math.cos(a)*wcut.rx*w, y=Math.sin(a)*wcut.ry*w; cl.push([c[0]+x*Math.cos(t0)-y*Math.sin(t0), c[1]+x*Math.sin(t0)+y*Math.cos(t0)]); }
    const e = outerPoly[MM.nearIdx(c, outerPoly)];

  // ════ BONUS SITES ════

  <ellipse cx="${MM.f(c[0])}" cy="${MM.f(c[1])}" rx="30" ry="22" fill="#b89ad8" opacity="0.18" filter="url(#${ID('mist')})"/>

  }

  // ════ FRAME, TITLE, COMPASS, LEGEND ════

// ── MANOR MAP INTERACTION ─────────────────────────────────────────────────
const manorRaided = {}; // { charName: Set of lot keys }

function initManorMap(charName) {
  if (!manorRaided[charName]) manorRaided[charName] = new Set();
  const svgId = 'msv_' + charName;
  const svg = document.getElementById(svgId);
  if (!svg || svg.dataset.bound) return;   // never bind twice: a second click handler would undo the first
  svg.dataset.bound = '1';

  let tip = document.getElementById('mtip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'mtip';
    tip.style.cssText = 'position:fixed;background:#16100a;color:#f0e4c8;border:1px solid #b8902a;border-radius:3px;padding:.5rem .85rem;font-family:Crimson Pro,serif;font-size:.82rem;line-height:1.5;pointer-events:none;opacity:0;transition:opacity .12s;max-width:240px;z-index:9999;';
    document.body.appendChild(tip);
  }
  const over = (MANOR_MAP_CONFIG[charName] && MANOR_MAP_CONFIG[charName].zoneText) || {};

  // redraw any raids already marked (the map is rebuilt when tabs change)
  manorRaided[charName].forEach(k => { const z = svg.querySelector(`.mz[data-key="${k}"]`); if (z) manorRaidOverlay(svg, z, k, true); });
  manorUpdateStatus(charName);

  svg.querySelectorAll('.mz').forEach(z => {
    const key = z.dataset.key;
    const ch  = z.dataset.char;
    const isImprov = key && key.startsWith('improv-');
    const d = isImprov
      ? { name: z.dataset.improvName, text: z.dataset.improvText, raidable: false }
      : (MANOR_ZONE_DATA[key] ? Object.assign({}, MANOR_ZONE_DATA[key], over[key] || {}, z.dataset.zname ? {name: z.dataset.zname} : {}, z.dataset.ztext ? {text: z.dataset.ztext} : {}) : null);
    if (!d) return;

    z.addEventListener('mouseenter', e => {
      const raided = manorRaided[ch] && manorRaided[ch].has(key);
      let extra = d.raidable ? (raided
        ? '<div style="margin-top:.35rem;font-size:.76rem;color:#e08080;font-style:italic;border-top:1px solid rgba(139,26,26,.35);padding-top:.3rem">⚔ Raided — harvest lost. Click to restore.</div>'
        : '<div style="margin-top:.35rem;font-size:.76rem;color:#e08080;font-style:italic;border-top:1px solid rgba(139,26,26,.35);padding-top:.3rem">Click to mark as raided</div>') : '';
      tip.innerHTML = `<b style="font-family:'Cinzel',serif;font-size:.67rem;letter-spacing:.07em;color:#d4aa45;display:block;margin-bottom:.2rem;text-transform:uppercase">${d.name}</b>${d.text}${extra}`;
      tip.style.opacity = '1';
      manorPositTip(e);
      manorHilite(z, key, ch, true);
    });
    z.addEventListener('mousemove', manorPositTip);
    z.addEventListener('mouseleave', () => {
      tip.style.opacity = '0';
      manorHilite(z, key, ch, false);
    });
    if (d.raidable) z.addEventListener('click', () => manorToggleRaid(z, key, ch, d.name));
  });
}

// hover outline: a gold copy of the zone's outline, drawn above everything
function manorHilite(z, key, ch, on) {
  const svg = z.ownerSVGElement, hl = svg && svg.querySelector('#' + svg.id + '-hl');
  if (!hl) return;
  hl.innerHTML = '';
  if (!on) return;
  const isRaided = manorRaided[ch] && manorRaided[ch].has(key);
  z.querySelectorAll('.zo').forEach(s => {
    const c = s.cloneNode(false);
    c.removeAttribute('class');
    c.setAttribute('fill', isRaided ? 'rgba(255,80,80,0.08)' : 'rgba(255,230,150,0.14)');
    c.setAttribute('stroke', isRaided ? '#ff5555' : '#e0b030');
    c.setAttribute('stroke-width', '3');
    hl.appendChild(c);
  });
}

function manorRaidOverlay(svg, z, key, on) {
  const layer = svg.querySelector('#' + svg.id + '-raid');
  const old = svg.querySelector(`.mro[data-k="${key}"]`);
  if (old) old.remove();
  if (!on || !layer) return;
  const base = z.querySelector('.zo');
  if (!base) return;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'mro'); g.setAttribute('data-k', key);
  const a = base.cloneNode(false); a.removeAttribute('class');
  a.setAttribute('fill', 'rgba(110,20,10,0.42)'); a.setAttribute('stroke', '#8b1a1a'); a.setAttribute('stroke-width', '2.5'); a.setAttribute('stroke-dasharray', '7,3');
  g.appendChild(a);
  // scorch marks scattered over the field
  const bb = base.getBBox();
  for (let i = 0; i < 6; i++) {
    const x = bb.x + bb.width * (0.2 + 0.6 * ((i * 0.37) % 1)), y = bb.y + bb.height * (0.2 + 0.6 * ((i * 0.61) % 1));
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 5 + (i % 3) * 3);
    c.setAttribute('fill', '#2a0a04'); c.setAttribute('opacity', '0.35');
    if (base.isPointInFill && !base.isPointInFill(Object.assign(svg.createSVGPoint(), {x, y}))) continue;
    g.appendChild(c);
  }
  layer.appendChild(g);
}

function manorToggleRaid(z, key, ch, name) {
  if (!manorRaided[ch]) manorRaided[ch] = new Set();
  const set = manorRaided[ch], svg = z.ownerSVGElement;
  if (set.has(key)) {
    set.delete(key);
    manorRaidOverlay(svg, z, key, false);
    manorLog(ch, `${name} — raid mark cleared.`);
  } else {
    set.add(key);
    manorRaidOverlay(svg, z, key, true);
    manorLog(ch, `⚔ ${name} has been raided! Harvest lost this season.`);
  }
  manorHilite(z, key, ch, true);
  manorUpdateStatus(ch);
}

function manorLog(ch, msg) {
  const el = document.getElementById('rslog-'+ch);
  if (el) { el.textContent=msg; el.style.display='block'; }
}

function manorUpdateStatus(ch) {
  const set = manorRaided[ch] || new Set();
  const val = document.getElementById('rsval-'+ch);
  const btn = document.getElementById('rsclear-'+ch);
  const svg = document.getElementById('msv_' + ch);
  const nameOf = k => { const z = svg && svg.querySelector(`.mz[data-key="${k}"]`); return z && z.dataset.zname && z.dataset.zname.startsWith('Half') ? 'Half lot' : k.replace('lot','Lot '); };
  if (val) val.textContent = set.size ? [...set].map(nameOf).join(', ') : 'none';
  if (btn) btn.style.display = set.size ? 'inline-block' : 'none';
}

function manorClearRaids(ch) {
  const set = manorRaided[ch] || new Set();
  const svg = document.getElementById('msv_' + ch);
  if (svg) svg.querySelectorAll('.mro').forEach(el=>el.remove());
  set.clear();
  manorUpdateStatus(ch);
  manorLog(ch, 'All raid marks cleared.');
}

function manorPositTip(e) {
  const tip = document.getElementById('mtip');
  if (!tip) return;
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + 250 > window.innerWidth)  x = e.clientX - 256;
  if (y + 150 > window.innerHeight) y = e.clientY - 150;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}

const BONUS_ICONS = {'Single Plinth':'🗿','Hermitage':'⛪','Haunted Graveyard':'💀','Site of a famous battle against Romans':'⚔'};

const fmtL = v => (v>0?'+':v<0?'−':'±') + Math.abs(+v||0) + '£';
const rowCosts = r => (r.lifestyleCost||0)+(r.improvMaint||0)+(r.family||0)+(r.improvBuild||0)+Math.abs(r.misc||0);

// idx 0 + Demesne → home; other Demesne → remote demesne; else enfeoffed
function classifyManor(m, idx){
  if (idx === 0 && m.type.includes('Demesne')) return 'home';
  if (m.type.includes('Demesne')) return 'demesne';
  return 'enfeoffed';
}
function estateHome(charName){
  const d = MANOR_DATA[charName]; if (!d) return null;
  return d.manors.find((m,i) => classifyManor(m,i) === 'home') || null;
}
function estateYears(charName){
  const m = estateHome(charName);
  return (m && m.history || []).slice().sort((a,b) => a.year - b.year).map(h => ({
    year:h.year, harvest:h.harvestResult||'', income:h.income||0, costs:rowCosts(h),
    final:h.final||0, notes:h.notes||'', recorded: (h.income||0) > 0
  }));
}

function holderClass(holder){
  const h = holder || '';
  const pcm = h.match(/Rhydian|Gwegon|Timotheus|Agragan|Mellyr/);
  if (pcm) return 'pc_' + pcm[0].toLowerCase();
  if (h === 'Count Roderick') return 'roderick';
  if (h === 'Sir Elad') return 'elad';
  if (/Hywel/.test(h)) return 'hywel';
  if (h === 'King Uther') return 'king';
  if (/Abbey|Abbot|Bishop|Priory/.test(h)) return 'church';
  if (/unnamed/.test(h)) return 'vassal';
  if (/Baron|Lord of|Duke|Unrecorded/.test(h)) return 'baron';
  return 'knight';
}
const HUND_TINTS = [
  { id:'roderick', label:"Count Roderick's",     fill:'#e2c25e', op:.22 },
  { id:'king',     label:"The King's",           fill:'#8e6aa8', op:.16 },
  { id:'church',   label:"The Church's",         fill:'#f8f3e6', op:.55 },
  { id:'baron',    label:"Other barons'",        fill:'#8f9a7e', op:.18 },
];
function lordTintId(lord){
  if (lord === 'Count Roderick') return 'roderick';
  if (lord === 'King Uther') return 'king';
  if (/Abbot|Bishop|Priory/.test(lord || '')) return 'church';
  return 'baron';
}
function lordTint(lord){
  const t = HUND_TINTS.find(x => x.id === lordTintId(lord));
  return [t.fill, t.op];
}
const hEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOLD_INK = '#2e2010', HOLD_PAPER = '#efe3c6';

function buildSalisburyMap(){

    <symbol id="slCastle" viewBox="-8 -9 16 16" overflow="visible">
      <path d="M-6.5 6V-2.2h-1V-5h2v1.3h1V-5h2v2.8h-1V0h7v-2.2h-1V-5h2v1.3h1V-5h2v2.8h-1V6z" fill="#5a4630" stroke="${HOLD_INK}" stroke-width=".7" stroke-linejoin="round"/>
      <path d="M-1.6 0V-5.8h-.9V-8.2h1.4v1h1.2v-1h1.4v2.4h-.9V0z" fill="#6c5640" stroke="${HOLD_INK}" stroke-width=".6"/>
      <path d="M-1.4 6V3.2a1.4 1.4 0 0 1 2.8 0V6z" fill="${HOLD_PAPER}"/><path d="M-4.6-1v1.6M4.6-1v1.6" stroke="${HOLD_PAPER}" stroke-width=".7"/></symbol>
    <symbol id="slCity" viewBox="-11 -11 22 20" overflow="visible">

    <symbol id="slTown" viewBox="-9 -7 18 13" overflow="visible">
      <g fill="#b9a37c" stroke="${HOLD_INK}" stroke-width=".7" stroke-linejoin="round">
        <path d="M-8.2 5V.6L-5.6-2.2L-3 .6V5z"/><path d="M3 5V.2L5.6-2.6L8.2.2V5z"/><path d="M-3.2 5V-1.4L0-4.8L3.2-1.4V5z"/></g>

    <symbol id="slAbbey" viewBox="-8 -10 16 15" overflow="visible">

      <path d="M-.4-2.4L3.3-5.6L7-2.4" fill="#d9ccae" stroke="${HOLD_INK}" stroke-width=".7" stroke-linejoin="round"/>
